title = "omarchy-plugin-connect secret-scanning config"

# Replaces .rafterignore. Standalone betterleaks does NOT read that file — it
# was a Rafter invention — so when Rafter was dropped from CI the allowlist
# silently stopped applying and every accepted false positive came back as a
# CRITICAL. This is betterleaks' own (gitleaks-compatible) config.
#
# Every entry below is a VERIFIED false positive. Re-verify before adding: an
# entry here is a permanent hole in the scan. Do NOT quote the offending line
# when explaining an entry — this file is itself scanned, so pasting the sample
# just moves the finding here.

[extend]
useDefault = true

# Credentials embedded in a database connection string. The default rules do
# NOT match `postgresql://user:pass@host/db`; that gap once hid four real leaks
# in this organisation, where only the Kubernetes stringData copies of the same
# password were reported. Tested to stay quiet on shell/Helm interpolation,
# REPLACE_WITH / CHANGEME placeholders and postgres:postgres dev defaults.
[[rules]]
id = "database-dsn-credentials"
description = "Password embedded in a database connection string (DSN)"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|clickhouse)://[^\s:@/]{1,64}:([^\s:@/]{8,})@'''
secretGroup = 1
keywords = ["postgres", "postgresql", "mysql", "mariadb", "mongodb", "redis", "amqp", "clickhouse"]

[rules.allowlist]
regexTarget = "match"
regexes = [
  '''\$\{[^}]*\}''',
  '''\$\([^)]*\)''',
  '''\{\{[^}]*\}\}''',
  '''(?i)(changeme|replace_?me|replace_with|your_?password|password_here|<[^>]+>|\*{3,}|x{8,})''',
  '''://[^\s:@/]+:(postgres|mysql|root|admin|password|secret|example)@''',
]

[allowlist]
description = "Verified false positives"
paths = [
  # Vendored upstream xterm.js: a 289KB single-line minified UMD bundle. The
  # generic-api-key rule is an entropy check and matches the bundle's own
  # internal TwoKeyMap class name. Third-party build output; a real finding
  # here would be a supply-chain question, not a secret-scanning one.
  '''internal/webui/assets/xterm\.js''',

]
