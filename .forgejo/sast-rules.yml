  message: "The application dynamically constructs file or path information. If the path\ninformation comes from user input,\
    \ it could be abused to read sensitive files,\naccess other users data, or aid in exploitation to gain further system\
    \ access.\n\nUser input should never be used in constructing paths or files for interacting\nwith the filesystem. This\
    \ includes filenames supplied by user uploads or downloads.\nIf possible consider hashing user input or replacing it with\
    \ unique values and\nuse `System.IO.Path.GetFullPath` to resolve and validate the path information\nprior to processing\
    \ any file functionality.\n\nExample using `Path.GetFullPath` and not allowing direct user input:\n```\n// store user\
    \ input alongside an ID we control\nstruct userData\n{\n    public string userFilename;\n    public Guid id;\n}\n\nclass\
    \ Program\n{\n    public static void Main()\n    {\n        userData data = new userData();\n        // user input, saved\
    \ only as a reference\n        data.userFilename = \"..\\\\test.txt\";\n\n        // random id as the filename\n     \
    \   data.id = Guid.NewGuid();\n\n        // restrict all file processing to this directory only\n        string basePath\
    \ = \"C:\\\\Restricted\\\\\";\n\n        // resolve the full path, but only use our random generated id\n        string\
    \ fullPath = Path.GetFullPath(basePath + data.id);\n\n        // verify the path is contained within our basePath\n  \
    \      if (!fullPath.StartsWith(basePath)) {\n            Console.WriteLine(\"Invalid path specified!\");\n          \
    \  return;\n        }\n        // process / work with file\n    }\n}\n```\n\nFor more information on path traversal issues\
    \ see OWASP:\nhttps://owasp.org/www-community/attacks/Path_Traversal\n"
  metadata:
    shortDescription: Improper limitation of a pathname to a restricted directory ('Path Traversal')
    category: security
