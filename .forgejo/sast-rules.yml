- id: python_deserialization_rule-cpickle
  languages:
  - python
  message: "The application was found using `cPickle` which is vulnerable to deserialization attacks.\nDeserialization attacks\
    \ exploit the process of reading serialized data and turning it back\ninto an object. By constructing malicious objects\
    \ and serializing them, an adversary may\nattempt to:\n\n- Inject code that is executed upon object construction, which\
    \ occurs during the\ndeserialization process.\n- Exploit mass assignment by including fields that are not normally a part\
    \ of the serialized\ndata but are read in during deserialization.\n\nConsider safer alternatives such as serializing data\
    \ in the JSON format. Ensure any format\nchosen allows\nthe application to specify exactly which object types are allowed\
    \ to be deserialized.\n\nTo protect against mass assignment, only allow deserialization of the specific fields that are\n\
    required. If this is not easily done, consider creating an intermediary type that\ncan be serialized with only the necessary\
    \ fields exposed.\n\nExample JSON deserializer using an intermediary type that is validated against a schema to\nensure\n\
    it is safe from mass assignment:\n```\nimport jsonschema\n\n# Create a schema to validate our user-supplied input against\n\
    # an intermediary object\nintermediary_schema = {\n    \"type\" : \"object\",\n    \"properties\" :  {\n        \"name\"\
    : {\"type\" : \"string\"}\n    },\n    \"required\": [\"name\"],\n    # Protect against random properties being added\
    \ to the object\n    \"additionalProperties\": False,\n}\n# If a user attempted to add \"'is_admin': True\" it would cause\
    \ a validation error\nintermediary_object = {'name': 'test user'}\n\ntry:\n    # Validate the user supplied intermediary\
    \ object against our schema\n    jsonschema.validate(instance=intermediary_object, schema=intermediary_schema)\n    user_object\
    \ = {'user':\n        {\n            # Assign the deserialized data from intermediary object\n            'name': intermediary_object['name'],\n\
    \            # Add in protected data in object definition (or set it from a class constructor)\n            'is_admin':\
    \ False,\n        }\n    }\n    # Work with the user_object\nexcept jsonschema.exceptions.ValidationError as ex:\n   \
    \ # Gracefully handle validation errors\n    # ...\n```\n\nFor more details on deserialization attacks in general, see\
    \ OWASP's guide:\n- https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html\n"
  metadata:
    cwe: CWE-502
    owasp:
    - A8:2017-Insecure Deserialization
    - A08:2021-Software and Data Integrity Failures
    - A08:2025-Software or Data Integrity Failures
    category: security
    shortDescription: Deserialization of untrusted data
    security-severity: High
  pattern: cPickle.$FUNC(...)
  severity: WARNING
