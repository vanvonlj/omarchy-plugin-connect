- id: go_filesystem_rule-decompression-bomb
  languages:
  - go
  mode: taint
  pattern-sources:
  - pattern: gzip.NewReader(...)
  - pattern: zlib.NewReader(...)
  - pattern: bzip2.NewReader(...)
  - pattern: flate.NewReader(...)
  - pattern: lzw.NewReader(...)
  - pattern: tar.NewReader(...)
  - pattern: zip.NewReader(...)
  - pattern: zlib.NewReaderDict(...)
  - pattern: flate.NewReaderDict(...)
  - pattern: zip.OpenReader(...)
  pattern-sanitizers:
  - patterns:
    - pattern: io.LimitReader($TAINTED, ...)
    - focus-metavariable: $TAINTED
  pattern-sinks:
  - patterns:
    - pattern: io.Copy($DST, $TAINTED)
    - focus-metavariable: $TAINTED
  - patterns:
    - pattern: io.CopyBuffer($DST, $TAINTED, $BUF)
    - focus-metavariable: $TAINTED
  message: "Directly decompressing files or buffers may lead to a potential Denial of Service (DoS)\ndue to a decompression\
    \ bomb. Decompression bombs are maliciously compressed files\nor data that decompresses to extremely large sizes. This\
    \ can cause the process to run\nout of memory, or the disk to fill up.\n\nTo protect against decompression bombs, an\n\
    [io.LimitReader(...)](https://pkg.go.dev/io#LimitReader)\nshould be used to limit how much can be read during the decompression\
    \ routine.\n\nExample using `io.LimitReader` to protect against a decompression bomb:\n```\nf, err := os.Open(\"some.gz\"\
    )\nif err != nil {\n  log.Fatal(err)\n}\n\nr, err := gzip.NewReader(f)\nif err != nil {\n  log.Fatal(err)\n}\n\nconst\
    \ oneMegabyte = 1024 * 1024\nlimitedReader := io.LimitReader(r, oneMegabyte)\n\n// use limitedReader to stop copying after\
    \ 1 MB\nif _, err := io.Copy(os.Stdout, limitedReader); err != nil {\n  log.Fatal(err)\n}\n```\n"
  metadata:
    shortDescription: Improper handling of highly compressed data
    cwe: CWE-409
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    security-severity: Medium
    category: security
  severity: WARNING
- id: go_filesystem_rule-fileread
  languages:
  - go
  mode: taint
  pattern-sources:
  - pattern: os.Getenv(...)
  - pattern: fmt.Sprintf(...)
  - pattern: filepath.Join(...)
  - pattern: path.Join(...)
  - patterns:
    - pattern-either:
      - pattern: '... + $TAINTED'
      - pattern: '... + $TAINTED + ...'
      - pattern: $TAINTED + ...
    - pattern-not: '"..." + $TAINTED'
    - pattern-not: '"..." + $TAINTED + "..."'
    - pattern-not: $TAINTED + "..."
    - pattern-not: fmt.Sprintf("...", "...")
  - patterns:
    - pattern-either:
      - pattern: '($REQUEST : *http.Request).$SOURCE_METHOD

          '
      - pattern: '($REQUEST : http.Request).$SOURCE_METHOD

          '
    - metavariable-regex:
        metavariable: $SOURCE_METHOD
        regex: ^(BasicAuth|Body|Cookie|Cookies|Form|FormValue|GetBody|Host|MultipartReader|ParseForm|ParseMultipartForm|PostForm|PostFormValue|Referer|RequestURI|Trailer|TransferEncoding|UserAgent|URL)$
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: '$CLEAN := $PKG.Clean(...)

          ...

          if !strings.HasPrefix($CLEAN, "...") {...}

          '
      - pattern: '$CLEAN := $PKG.Clean(...)

          ...

          if strings.HasPrefix($CLEAN, "...") {...}

          '
      - pattern: '$CLEAN := $PKG.Clean(...)

          ...

          if strings.HasPrefix($CLEAN, "...") == false {...}

          '
    - metavariable-regex:
        metavariable: $PKG
        regex: ^((file)?path)$
  pattern-sinks:
  - pattern: os.OpenFile(...)
  - pattern: os.Open(...)
  - pattern: os.ReadFile(...)
  - pattern: ioutil.ReadFile(...)
  message: "The application dynamically constructs file or path information. If the path\ninformation comes from user input,\
    \ it could be abused to read sensitive files,\naccess other users data or aid in exploitation to gain further system access.\n\
    \nUser input should never be used in constructing paths or files for interacting\nwith the filesystem. This includes filenames\
    \ supplied by user uploads or downloads.\nIf possible, consider hashing user input or replacing it with unique values.\n\
    Additionally, use `filepath.Base` to only use the filename and not path information.\nAlways validate the full path prior\
    \ to opening or writing to any file.\n\nExample using `filepath.Base`, generating a unique filename without using\nuser\
    \ input to construct filepath information:\n```\ntype userData struct {\n    id           string\n    userFilename string\n\
    }\n\nfunc newUserData(userFilename string) userData {\n    return userData{\n        id:           randomFileID(), //\
    \ random id as the filename\n        userFilename: userFilename,\n    }\n}\n\n// randomFileID generates a random id, to\
    \ be used as a filename\nfunc randomFileID() string {\n    id := make([]byte, 16)\n    if _, err := io.ReadFull(rand.Reader,\
    \ id); err != nil {\n        log.Fatal(err)\n    }\n    return hex.EncodeToString(id)\n}\n\nfunc main() {\n\n    // user\
    \ input, saved only as a reference\n    data := newUserData(\"../../possibly/malicious\")\n\n    // restrict all file\
    \ access to this path\n    const basePath = \"/tmp/\"\n\n    // resolve the full path, but only use our random generated\
    \ id\n    resolvedPath, err := filepath.Join(basePath, filepath.Base(data.id))\n    if err != nil {\n        log.Fatal(err)\n\
    \    }\n\n    // verify the path is prefixed with our basePath\n    if !strings.HasPrefix(resolvedPath, basePath) {\n\
    \        log.Fatal(\"path does not start with basePath\")\n    }\n    // process / work with file\n}\n```\n\nFor more\
    \ information on path traversal issues see OWASP:\nhttps://owasp.org/www-community/attacks/Path_Traversal\n"
  metadata:
    shortDescription: Improper limitation of a pathname to a restricted directory ('Path Traversal')
    cwe: CWE-22
    owasp:
    - A5:2017-Broken Access Control
    - A01:2021-Broken Access Control
    - A01:2025-Broken Access Control
    security-severity: Medium
    category: security
  severity: WARNING
- id: go_filesystem_rule-httprootdir
  languages:
