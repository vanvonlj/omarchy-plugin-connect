  metadata:
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    cwe: CWE-787
    shortDescription: Out-of-bounds write
    security-severity: MEDIUM
    category: security
    source-rule-url: https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-buffer-noassert.js
  message: "The application is using Buffer API methods with the `noAssert` \nparameter set to `true` for the write buffer\
    \ methods. This disables \nthe bounds checking and could result in writing beyond the end of \nthe buffer, leading to\
    \ potential memory corruption and security \nvulnerabilities. When `noAssert` is set to `true`, the methods \ndo not perform\
    \ bounds checking, allowing the offset to be beyond \nthe end of the buffer. This can lead to out-of-bounds memory access,\
    \ \ncausing undefined behavior, crashes, or potential security exploits.\n\nTo mitigate the issue, ensure that the `noAssert`\
    \ parameter is not \nset to `true`. Always use bounds checking to prevent out-of-bounds \nmemory access. Validate the\
    \ offset before performing write operations \non the buffer.\n\nSecure Code Example:\n```\n  const buffer = Buffer.alloc(10);\
    \ // Allocate a buffer of 10 bytes\n\n  function safeBufferMethods(buf) {\n    const safeOffset = 5; // An offset within\
    \ the bounds of the buffer\n\n    // Secure write methods\n    if (safeOffset < buf.length) {\n      buf.writeUInt8(0,\
    \ safeOffset);\n      buf.writeUInt16LE(0, safeOffset);\n      buf.writeUInt16BE(0, safeOffset);\n      buf.writeUInt32LE(0,\
    \ safeOffset);\n      buf.writeUInt32BE(0, safeOffset);\n      buf.writeInt8(0, safeOffset);\n      buf.writeInt16LE(0,\
    \ safeOffset);\n      buf.writeInt16BE(0, safeOffset);\n      buf.writeInt32LE(0, safeOffset);\n      buf.writeInt32BE(0,\
    \ safeOffset);\n      buf.writeFloatLE(0, safeOffset);\n      buf.writeFloatBE(0, safeOffset);\n      buf.writeDoubleLE(0,\
    \ safeOffset);\n      buf.writeDoubleBE(0, safeOffset);\n    }\n  }\n\n  try {\n    safeBufferMethods(buffer);\n  } catch\
    \ (error) {\n    console.error('Caught an error:', error);\n  }\n```\n"
- id: javascript_buf_rule-detect-new-buffer
  languages:
  - javascript
  - typescript
  patterns:
  - patterns:
    - pattern-not-inside: 'require("safe-buffer")

        ...'
    - pattern-not-inside: 'import { Buffer } from "safe-buffer"

        ...'
    - pattern-inside: function $FUNC(..., $X, ...) { ... }
    - pattern: new Buffer($X,...)
  - pattern-not: 'new Buffer("...",...)

      '
  - pattern-not: 'new Buffer([...] , ...)

      '
  message: 'The application was found calling  the `new Buffer` constructor which has been deprecated

    since Node 8.

    By passing in a non-literal value, an adversary could allocate large amounts of memory.


    Other issues also exist with the `Buffer` constructor:

    - Older versions would return uninitialized memory, which could contain sensitive information

    - Unable to easily determine what a Buffer contained if passed a non-literal value


    To remediate this issue, use `Buffer.alloc` or `Buffer.from` instead to allocate a new

    `Buffer`.


    Example using `Buffer.alloc` instead of `new Buffer(...)`:

    ```

    // Create a new buffer using Buffer.from

    const buf = Buffer.from([1, 2, 3, 4]);

    // Work with buf

    ```


    For more information on migrating to `Buffer.from()`/`Buffer.alloc()` see:

    - https://nodejs.org/en/docs/guides/buffer-constructor-deprecation

    '
  metadata:
    shortDescription: Allocation of resources without limits or throttling
    cwe: CWE-770
    category: security
