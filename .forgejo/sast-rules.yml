- id: lukejv_ng_xss_rule-bypass-security-trust-non-literal
  languages:
  - typescript
  - javascript
  severity: WARNING
  message: |
    Angular's bypassSecurityTrust* switches off sanitising for this value, and the value is not
    a literal. If any of it comes from a user, it is stored XSS.
    Let Angular sanitise it (bind with [innerHTML]), or sanitise it yourself first with
    `DomSanitizer.sanitize(SecurityContext.HTML, value)`.
  metadata:
    cwe: CWE-79
    category: security
    shortDescription: Angular sanitiser bypassed for a non-literal
    security-severity: Medium
  patterns:
  - pattern: $S.$BYPASS($X)
  - metavariable-regex:
      metavariable: $BYPASS
      regex: ^bypassSecurityTrust(?:Html|Style|Script|Url|ResourceUrl)$
  - pattern-not: $S.$BYPASS("...")
  - metavariable-regex:
      metavariable: $X
      regex: '^(?!`[^`$]*`$)'
- id: lukejv_js_xss_rule-inner-html-non-literal
  languages:
  - typescript
  - javascript
  severity: WARNING
  message: |
    A non-literal is written to innerHTML/outerHTML, so any markup in it is parsed and its
    event handlers run. Use `textContent` for text, or build elements with createElement.
  metadata:
    cwe: CWE-79
    category: security
    shortDescription: DOM XSS via innerHTML assignment
    security-severity: Medium
  patterns:
  - pattern-either:
    - pattern: $EL.innerHTML = $X
    - pattern: $EL.outerHTML = $X
    - pattern: $EL.innerHTML += $X
    - pattern: $EL.outerHTML += $X
  - pattern-not: $EL.$P = "..."
  - pattern-not: $EL.$P += "..."
  # Safe idioms, and only these: the whole value is one escape-helper call, or
  # a template whose EVERY `${}` starts with one. `esc(a) + b` and
  # `${esc(a)}${b}` still fire. Gap: a fully-escaped template joined by `+` to
  # a raw value is not caught.
  - pattern-not: $EL.$P = esc(...)
  - pattern-not: $EL.$P = escape(...)
  - pattern-not: $EL.$P = escapeHtml(...)
  - pattern-not: $EL.$P = escapeHTML(...)
  - pattern-not: $EL.$P = sanitizeHtml(...)
  - pattern-not: $EL.$P = DOMPurify.sanitize(...)
  - metavariable-regex:
      metavariable: $X
      regex: '^(?:(?![\s\S]*\$\{)[\s\S]*|[\s\S]*\$\{(?!\s*(?:esc|escape|escapeHtml|escapeHTML|sanitizeHtml|DOMPurify\.sanitize)\()[\s\S]*)$'
  - metavariable-regex:
      metavariable: $X
      regex: '^(?!`[^`$]*`$)'
