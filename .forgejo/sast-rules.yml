        '
  - metavariable-regex:
      metavariable: $ARG
      regex: (/tmp/.*|/var/tmp/.*)
  message: "The application was found creating files in shared system temporary directories\n(`/tmp` or `/var/tmp`) without\
    \ using the `os.CreateTemp` function. Depending\non how the application uses this temporary file, an attacker may be able\
    \ to create\nsymlinks that point to other files prior to the application creating or writing\nto the target file, leading\
    \ to unintended files being created or overwritten.\n\nExample using `os.CreateTemp` in an application restricted directory:\n\
    ```\n// assumes /opt/appdir/ is chown'd to the running application user\nif err := os.MkdirAll(\"/opt/appdir/restricted\"\
    , 0700); err != nil {\n  log.Fatal(err)\n}\n\n// create a temporary file in the restricted directory in the form of temp-952569059.txt\n\
    f, err := os.CreateTemp(\"/opt/appdir/restricted\", \"temp-*.txt\")\nif err != nil {\n  log.Fatal(err)\n}\n\ndefer f.Close()\n\
    // clean up on exit\ndefer os.Remove(f.Name())\n// work with file\n```\n"
  metadata:
    shortDescription: Creation of temporary file with insecure permissions
    cwe: CWE-378
    owasp:
    - A5:2017-Broken Access Control
    - A01:2021-Broken Access Control
    security-severity: Medium
    category: security
  severity: WARNING
- id: go_filesystem_rule-ziparchive
  languages:
  - go
  mode: taint
  pattern-sources:
  - pattern: zip.OpenReader(...)
  - pattern: tar.OpenReader(...)
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: '$CLEAN := $PKG.Clean(...)

          ...

          if !strings.HasPrefix($CLEAN, "...") {...}

          '
      - pattern: '$CLEAN := $PKG.Clean(...)

          ...

          if strings.HasPrefix($CLEAN, "...") {...}

          '
      - pattern: '$CLEAN := $PKG.Clean(...)

          ...

          if strings.HasPrefix($CLEAN, "...") == false {...}

          '
    - metavariable-regex:
        metavariable: $PKG
        regex: ^((file)?path)$
  pattern-sinks:
  - pattern: filepath.Join(...)
  message: "The application may be vulnerable to a path traversal if it extracts untrusted archive files.\nThis vulnerability\
    \ is colloquially known as 'Zip Slip'. Archive files may contain folders\nwhich,\nwhen extracted, may write outside of\
    \ the intended directory. This is exploited by including\npath traversal characters such as `../../other/directory` to\
    \ overwrite or place files in system\nor application directories.\n\nExtra care must be taken when extracting archive\
    \ files as there are numerous concerns:\n\n- Limit the size of the zip archive as it may contain \"Zip Bombs\", files\
    \ that extract to\nextremely\nlarge sizes.\n- If possible, generate unique filenames instead of using the archives file\
    \ names, as it may be\npossible for users to overwrite files if the filenames are the same.\n- Validate file paths are\
    \ written with a prefixed, known trusted directory.\n- Only process regular files and not symbolic links, as some applications\
    \ may attempt to\nread/follow\nthe symbolic link, leading to arbitrary file read / write vulnerabilities.\n\n\nExample\
    \ of securely processing an archive file:\n```\nr, err := zip.OpenReader(\"trusted.zip\")\nif err != nil {\n  log.Fatal(err)\n\
    }\n\n// Ensure archive contains only the expected number of files\nconst expectedFileCount = 10\nif len(r.File) > expectedFileCount\
    \ {\n  log.Fatalf(\"too many files in archive: %d\\n\", len(r.File))\n}\n\n// One approach is to sum up all files before\
    \ attempting to process\n// them.\nconst totalAllowedSize = 1024 * 1024 * 10 // 10MB\nvar totalSize uint64\nfor _, f :=\
    \ range r.File {\n  totalSize += f.UncompressedSize64\n}\n\nif totalSize > totalAllowedSize {\n  log.Fatalf(\"archive\
    \ exceeds total allowed size: %d\\n\", totalSize)\n}\n\n// configure a max size per file allowed\nconst maxFileSize =\
    \ 1024 * 1024 // 1 MB\n\n// set restricted basePath\nconst basePath = \"/var/restricted/\"\n\n// iterate over the files\
    \ in the archive\nfor _, f := range r.File {\n\n  // Ensure uncompressed size does not exceed our allowed file size\n\
    \  if f.UncompressedSize64 > maxFileSize {\n    log.Printf(\"skipping file as it exceeds maxFileSize: %s\\n\", f.Name)\n\
    \    continue\n  }\n\n  // Ensure file is a regular file and not a symbolic link or has other mode type\n  // bits set\n\
    \  if !f.Mode().IsRegular() {\n    log.Printf(\"skipping non regular file: %s\\n\", f.Name)\n    continue\n  }\n\n  //\
    \ if possible consider not using the name at all, but generating a random id instead.\n  // If the filename must be used,\
    \ extract the base name and not folder path information\n  name := filepath.Base(f.Name)\n\n  // Join the file name to\
    \ the basePath.\n  resolvedPath := filepath.Join(basePath, name)\n\n  // Application must still verify the path is prefixed\
    \ by the basePath\n  if !strings.HasPrefix(resolvedPath, basePath) {\n    log.Fatal(\"path does not start with basePath\"\
    )\n  }\n\n  // process / work with file\n}\n```\n\nIf the application must process directory names as well, use the following\
    \ code:\n```\n// Join the cleaned name to the basePath, note if 'name' starts with `../../` it\n// will still allow for\
    \ traversal, so you _must_ verify the path prefix below\nresolvedPath := filepath.Join(basePath, filepath.Clean(name))\n\
    \n// Application must still verify the path is prefixed by the basePath\nif !strings.HasPrefix(resolvedPath, basePath)\
    \ {\n  log.Fatal(\"path does not start with basePath\")\n}\n\n// process / work with file\n```\n"
  metadata:
    shortDescription: Improper limitation of a pathname to a restricted directory ('Path Traversal')
    cwe: CWE-22
    owasp:
    - A5:2017-Broken Access Control
    - A01:2021-Broken Access Control
    - A01:2025-Broken Access Control
    security-severity: Medium
    category: security
  severity: WARNING
- id: go_http_rule-http-serve
  languages:
  - go
  patterns:
  - pattern-inside: 'import "net/http"

      ...

      '
  - pattern-either:
    - pattern: http.ListenAndServe(...)
    - pattern: http.ListenAndServeTLS(...)
    - pattern: http.Serve(...)
    - pattern: http.ServeTLS(...)
    - patterns:
      - pattern-not-inside: "&http.Server{\n  ...,\n  ReadHeaderTimeout: ...,\n  ...,\n}\n"
      - pattern-not-inside: "&http.Server{\n  ...,\n  ReadTimeout: ...,\n  ...,\n}\n"
      - pattern-not-inside: "$S = &http.Server{\n  ...,\n}\n$S.ReadHeaderTimeout = ...\n...\n"
      - pattern-not-inside: "$S = &http.Server{\n  ...,\n}\n$S.ReadTimeout = ...\n...\n"
      - pattern: "&http.Server{\n  ...,\n}\n"
  message: "Go's `net/http` serve functions may be vulnerable to resource consumption attacks if timeouts\nare not properly\
    \ configured\nprior to starting the HTTP server. An adversary may open up thousands of connections but never\ncomplete\
    \ sending all data,\nor never terminate the connections. This may lead to the server no longer accepting new\nconnections.\n\
    \nTo protect against this style of resource consumption attack, timeouts should be set in the\n`net/http` server prior\
    \ to calling\nthe listen or serve functions. What this means is that the default `http.ListenAndServe` and\n`http.Serve`\
    \ functions should not\nbe used in a production setting as they are unable to have timeouts configured. Instead a\ncustom\
    \ `http.Server` object must be\ncreated with the timeouts configured.\n\nExample setting timeouts on a `net/http` server:\n\
    ```\n// All values chosen below are dependent on application logic and\n// should be tailored per use-case\nsrv := &http.Server{\n\
    \  Addr: \"localhost:8000\",\n  // ReadHeaderTimeout is the amount of time allowed to read\n  // request headers. The\
    \ connection's read deadline is reset\n  // after reading the headers and the Handler can decide what\n  // is considered\
    \ too slow for the body. If ReadHeaderTimeout\n  // is zero, the value of ReadTimeout is used. If both are\n  // zero,\
    \ there is no timeout.\n  ReadHeaderTimeout: 15 * time.Second,\n\n  // ReadTimeout is the maximum duration for reading\
    \ the entire\n  // request, including the body. A zero or negative value means\n  // there will be no timeout.\n  //\n\
    \  // Because ReadTimeout does not let Handlers make per-request\n  // decisions on each request body's acceptable deadline\
    \ or\n  // upload rate, most users will prefer to use\n  // ReadHeaderTimeout. It is valid to use them both.\n  ReadTimeout:\
    \ 15 * time.Second,\n\n  // WriteTimeout is the maximum duration before timing out\n  // writes of the response. It is\
    \ reset whenever a new\n  // request's header is read. Like ReadTimeout, it does not\n  // let Handlers make decisions\
    \ on a per-request basis.\n  // A zero or negative value means there will be no timeout.\n  WriteTimeout: 10 * time.Second,\n\
    \n  // IdleTimeout is the maximum amount of time to wait for the\n  // next request when keep-alives are enabled. If IdleTimeout\n\
    \  // is zero, the value of ReadTimeout is used. If both are\n  // zero, there is no timeout.\n  IdleTimeout: 30 * time.Second,\n\
    }\n\n// For per request timeouts applications can wrap all `http.HandlerFunc(...)` in\n// `http.TimeoutHandler`` and specify\
    \ a timeout, but note the TimeoutHandler does not\n// start ticking until all headers have been read.\n\n// Listen with\
    \ our custom server with timeouts configured\nif err := srv.ListenAndServe(); err != nil {\n  log.Fatal(err)\n}\n```\n\
    For more information on the `http.Server` timeouts, see: https://pkg.go.dev/net/http#Server\n\nFor information on setting\
    \ request based timeouts, see:\nhttps://pkg.go.dev/net/http#TimeoutHandler\n\nFor more information on the Slowloris attack\
    \ see:\nhttps://en.wikipedia.org/wiki/Slowloris_(computer_security)\n"
  metadata:
    shortDescription: Allocation of resources without limits or throttling
    cwe: CWE-770
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    security-severity: Low
    category: security
  severity: WARNING
- id: go_injection_rule-ssrf
  languages:
  - go
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-not-inside: 'import "testing"

        ...

        '
    - pattern-either:
      - pattern: os.Stdin
      - pattern: os.Getenv(...)
      - pattern: '($REQ: *http.Request).$ANY

          '
      - pattern: '($REQ: http.Request).$ANY

          '
      - patterns:
        - pattern: '($REQ : *http.Request)'
        - pattern-inside: "func $FUNC( $W http.ResponseWriter, $R *http.Request, ...) {\n  ...\n}\n"
  pattern-sinks:
  - pattern: http.Head(...)
  - pattern: http.Get(...)
  - pattern: http.Post(...)
  - pattern: http.PostForm(...)
  - pattern: http.NewRequest($METHOD,...)
  - pattern: http.DefaultClient.Head(...)
  - pattern: http.DefaultClient.Get(...)
  - pattern: http.DefaultClient.Post(...)
  - pattern: http.DefaultClient.PostForm(...)
  - pattern: http.NewRequestWithContext($CONTEXT, $METHOD, ...)
  - pattern: ftp.Dial(...)
  - pattern: ldap.DialURL(...)
  - pattern: smtp.Dial(...)
  - pattern: retryablehttp.NewRequest($METHOD, ..., $BODY)
  - patterns:
    - pattern-inside: '$C := retryablehttp.NewClient()

        ...

        '
    - pattern-either:
      - pattern: $C.Get(...)
      - pattern: $C.Post(..., $BODYTYPE, $BODY)
      - pattern: $C.PostForm(..., $VALS)
      - pattern: $C.Head(...)
  pattern-propagators:
  - pattern: $R := $D.NewDecoder($P)
    from: $P
    to: $R
  - pattern: $S.Decode(&$P)
    from: $S
    to: $P
  - pattern: $S.Decode($P)
    from: $S
    to: $P
  - pattern: $S.Unmarshal($B, &$P)
    from: $B
    to: $P
  - pattern: $S.Unmarshal($B, $P)
    from: $B
    to: $P
  message: "Server-Side-Request-Forgery (SSRF) exploits backend systems that initiate requests to third\nparties.\nIf user\
    \ input is used in constructing or sending these requests, an attacker could supply\nmalicious\ndata to force the request\
    \ to other systems or modify request data to cause unwanted actions.\n\nEnsure user input is not used directly in constructing\
    \ URLs or URIs when initiating requests\nto third party\nsystems from back end systems. Care must also be taken when constructing\
    \ payloads using user\ninput. Where\npossible restrict to known URIs or payloads. Consider using a server side map where\
    \ key's are\nused to return\nURLs such as `https://site/goto?key=1` where `{key: 1, url: 'http://some.url/', key: 2, url:\n\
    'http://...'}`.\n\nIf you must use user supplied input for requesting URLs, it is strongly recommended that the\nHTTP\
    \ client\nchosen allows you to customize and block certain IP ranges at the network level. By blocking\nRFC 1918\naddresses\
    \ or other network address ranges, you can limit the severity of a successful SSRF\nattack. Care must\nalso be taken to\
    \ block certain protocol or address formatting such as IPv6.\n\nIf you can not block address ranges at the client level,\
    \ you may want to run the HTTP client\nas a protected\nuser, or in a protected network where you can apply IP Table or\
    \ firewall rules to block access\nto dangerous\naddresses. Finally, if none of the above protections are available, you\
    \ could also run a\ncustom HTTP proxy\nand force all requests through it to handle blocking dangerous addresses.\n\nExample\
    \ HTTP client that disallows access to loopback and RFC-1918 addresses\n```\n// IsDisallowedIP parses the ip to determine\
    \ if we should allow the HTTP client to continue\nfunc IsDisallowedIP(hostIP string) bool {\n  ip := net.ParseIP(hostIP)\n\
    \  return ip.IsMulticast() || ip.IsUnspecified() || ip.IsLoopback() || ip.IsPrivate()\n}\n\n// SafeTransport uses the\
    \ net.Dial to connect, then if successful check if the resolved\n// ip address is disallowed. We do this due to hosts\
    \ such as localhost.lol being resolvable to\n// potentially malicious URLs. We allow connection only for resolution purposes.\n\
    func SafeTransport(timeout time.Duration) *http.Transport {\n  return &http.Transport{\n    DialContext: func(ctx context.Context,\
    \ network, addr string) (net.Conn, error) {\n      c, err := net.DialTimeout(network, addr, timeout)\n      if err !=\
    \ nil {\n        return nil, err\n      }\n      ip, _, _ := net.SplitHostPort(c.RemoteAddr().String())\n      if IsDisallowedIP(ip)\
    \ {\n        return nil, errors.New(\"ip address is not allowed\")\n      }\n      return c, err\n    },\n    DialTLS:\
    \ func(network, addr string) (net.Conn, error) {\n      dialer := &net.Dialer{Timeout: timeout}\n      c, err := tls.DialWithDialer(dialer,\
    \ network, addr, &tls.Config{})\n      if err != nil {\n        return nil, err\n      }\n\n      ip, _, _ := net.SplitHostPort(c.RemoteAddr().String())\n\
    \      if IsDisallowedIP(ip) {\n        return nil, errors.New(\"ip address is not allowed\")\n      }\n\n      err =\
    \ c.Handshake()\n      if err != nil {\n        return c, err\n      }\n\n      return c, c.Handshake()\n    },\n    TLSHandshakeTimeout:\
    \ timeout,\n  }\n}\n\nfunc httpRequest(requestUrl string) {\n  const clientConnectTimeout = time.Second * 10\n  httpClient\
    \ := &http.Client{\n    Transport: SafeTransport(clientConnectTimeout),\n  }\n  resp, err := httpClient.Get(requestUrl)\n\
    \  if err != nil {\n    log.Fatal(err)\n  }\n  defer resp.Body.Close()\n  // work with resp\n}\n```\n\nFor more information\
    \ on SSRF see OWASP:\nhttps://owasp.org/www-community/attacks/Server_Side_Request_Forgery\n"
  metadata:
    shortDescription: Server Side Request Forgery (SSRF)
    cwe: CWE-918
    owasp:
    - A1:2017-Injection
    - A10:2021-Server-Side Request Forgery
    - A01:2025-Broken Access Control
    security-severity: Medium
    category: security
  severity: WARNING
- id: go_injection_rule-template-injection
  languages:
  - go
  patterns:
  - pattern-either:
    - patterns:
      - pattern: template.HTML($IN)
      - pattern-not: template.HTML("...")
    - patterns:
      - pattern: template.JS($IN)
      - pattern-not: template.JS("...")
    - patterns:
      - pattern: template.URL($IN)
      - pattern-not: template.URL("...")
    - patterns:
      - pattern: template.HTMLAttr($IN)
      - pattern-not: template.HTMLAttr("...")
  message: "Cross Site Scripting (XSS) is an attack which exploits a web application or system to treat\nuser input\nas markup\
    \ or script code. It is important to encode the data depending on the specific context\nit\nis used in. There are at least\
    \ six context types:\n\n- Inside HTML tags `<div>context 1</div>`\n- Inside attributes: `<div class=\"context 2\"></div>`\n\
    - Inside event attributes `<button onclick=\"context 3\">button</button>`\n- Inside script blocks: `<script>var x = \"\
    context 4\"</script>`\n- Unsafe element HTML assignment: `element.innerHTML = \"context 5\"`\n- Inside URLs: `<iframe\
    \ src=\"context 6\"></iframe><a href=\"context 6\">link</a>`\n\nScript blocks alone have multiple ways they need to be\
    \ encoded. Extra care must be taken if\nuser input\nis ever output inside of script tags.\n\nUser input that is displayed\
    \ within the application must be encoded, sanitized or validated\nto ensure it cannot be treated as HTML or executed as\
    \ Javascript code. Care must also be\ntaken\nto not mix server-side templating with client-side templating, as the server-side\
    \ templating\nwill\nnot encode things like {{ 7*7 }} which may execute client-side templating features.\n\nIt is _NOT_\
    \ advised to encode user input prior to inserting into a data store. The data will\nneed to be\nencoded depending on context\
    \ of where it is output. It is much safer to force the displaying\nsystem to\nhandle the encoding and not attempt to guess\
    \ how it should be encoded.\n\nUse of the following template types with user input denotes a security risk:\n\n- [template.HTML](https://pkg.go.dev/html/template#HTML)\n\
    - [template.JS](https://pkg.go.dev/html/template#JS)\n- [template.URL](https://pkg.go.dev/html/template#URL)\n- [template.HTMLAttr](https://pkg.go.dev/html/template#HTMLAttr)\n\
    \nEither remove these types from the application or hardcode as const strings prior\nto conversion:\n```\ntestTemplate,\
    \ err := template.New(\"testTemplate\").Funcs(template.FuncMap{\n  \"SafeHTML\": func() template.HTML {\n    const safeHTML\
    \ = \"<div>hardcoded, safe html</div>\"\n    return template.HTML(safeHTML)\n  },\n}).Parse(`<html><body>{{ SafeHTML }}</body>`)\n\
    if err != nil {\n  log.Fatal(err)\n}\n\nif err := testTemplate.Execute(os.Stdout, nil); err != nil {\n  log.Fatal(err)\n\
    }\n```\n"
  metadata:
    shortDescription: Improper neutralization of input during web page generation ('Cross-site Scripting')
    cwe: CWE-79
    owasp:
    - A7:2017-Cross-Site Scripting (XSS)
    - A03:2021-Injection
    - A05:2025-Injection
    security-severity: Medium
    category: security
  severity: WARNING
- id: go_leak_rule-pprof-endpoint
  languages:
  - go
  patterns:
  - pattern-inside: "import (\n  \"net/http/pprof\"\n)\n...\n"
  - pattern-either:
    - pattern: http.ListenAndServe(...)
    - pattern: http.ListenAndServeTLS(...)
    - pattern: http.Serve(...)
    - pattern: http.ServeTLS(...)
  message: 'Go has a built in profiling service that is enabled by starting an HTTP server with

    `net/http/pprof` imported. The `/debug/pprof` endpoint does not require any

    authentication and can be accessed by anonymous users. This profiling endpoint

    can leak sensitive information and should not be enabled in production.


    To remediate this, remove the `net/http/pprof` import from the file.

    '
  metadata:
    shortDescription: Active debug code (pprof enabled)
    cwe: CWE-489
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    - A02:2025-Security Misconfiguration
    security-severity: Medium
    category: security
  severity: ERROR
- id: go_memory_rule-integer-overflow
  languages:
  - go
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: '$X, ... := strconv.Atoi(...)

          ...

          '
      - pattern-either:
        - pattern: int32($X)
        - pattern: int16($X)
  message: "Golang's `int` type size depends on the architecture of where the application is running. For\n32-bit systems,\
    \ `int` is\n32-bit, for 64-bit systems, `int` will be 64-bit. By calling `strconv.Atoi` with a large\nnumber, the integer\
    \ may overflow\nif the `int` return value is type converted into a smaller type (`int32` or `int16`). This\ncould cause\
    \ unexpected application\nbehavior depending on how the resultant value is used.\n\nPrior to running any type conversion,\
    \ check that the value returned from `strconv.Atoi` will\nfit in the resulting integer.\n\nExample of checking the return\
    \ value before type conversion:\n```\nbigValue, _ := strconv.Atoi(\"32768\")\nif bigValue > math.MaxInt16 {\n  log.Fatal(\"\
    value too large to fit in int16\")\n}\nvalue := int16(bigValue)\nfmt.Println(value)\n```\n\nFor more information on integer\
    \ min/max constants see: https://pkg.go.dev/math#pkg-constants\n"
  metadata:
    shortDescription: Integer overflow or wraparound
    cwe: CWE-190
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    security-severity: Medium
    category: security
  severity: ERROR
- id: go_memory_rule-memoryaliasing
  languages:
  - go
  patterns:
  - pattern-either:
    - pattern: "for ..., $ARG := range $SLICE {\n  <... &($ARG) ...>\n}\n"
    - pattern: "for ..., $ARG := range $SLICE {\n  <... func() { <... &$ARG ...> } ...>\n}\n"
    - pattern: "for ..., $ARG := range $SLICE {\n  <... $X(..., <... &$ARG ...>, ...) ...>\n}\n"
  - pattern-not: "for ..., $ARG := range $SLICE {\n  <... *$ARG ...>\n}\n"
  - pattern-not-inside: for ..., $ARG := range $SLICE { return ... }
  message: "Go's `for ... range` statements create an iteration variable for each iteration of the loop.\nBy taking the address\
    \ of this iteration variable, the value of the address will be re-used\nand always point to the same location in memory.\
    \ This can have unexpected behavior if the\naddress is stored or re-used.\n\nThis can be fixed by:\n- Not referencing\
    \ the address of the variable\n- Re-assigning the iteration variable to a new variable\n- Using the address of the indexed\
    \ variable\n\nExample not referencing the address:\n```\ntype someStruct struct {\n  x int\n}\n\nfor _, n := range []someStruct{{1},\
    \ {2}, {3}, {4}} {\n  fmt.Printf(\"%d\\n\", n.x)\n}\n```\n\nExample reassigning the iteration variable to a new variable:\n\
    ```\ntype someStruct struct {\n  x int\n}\n\nfor _, n := range []someStruct{{1}, {2}, {3}, {4}} {\n  p := n\n  fmt.Printf(\"\
    %p\\n\", &p)\n}\n```\n\nExample using the address of the indexed variable:\n```\ntype someStruct struct {\n  x int\n}\n\
    \nstructData := []someStruct{{1}, {2}, {3}, {4}}\nfor idx := range structData {\n  fmt.Printf(\"%p\\n\", &structData[idx])\n\
    }\n```\n\nFor more information on how the `for ... range` statement works see:\nhttps://go.dev/ref/spec#For_statements\n"
  metadata:
    shortDescription: Incorrect access of indexable resource ('Range Error')
    cwe: CWE-118
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    security-severity: Info
    category: security
  severity: WARNING
- id: go_network_rule-bind-to-all-interfaces
  languages:
  - go
  patterns:
  - pattern-either:
    - pattern: net.Listen(..., "$ADDR")
    - pattern: tls.Listen(..., "$ADDR", ...)
  - metavariable-regex:
      metavariable: $ADDR
      regex: ^(0\.0\.0\.0|\[::\])?(:[0-9]*)?$
  message: "Binding to all network interfaces can potentially open up a service to\ntraffic on unintended interfaces, that\
    \ may not be properly documented or\nsecured. By passing \"0.0.0.0\" as the address to the `Listen` family of functions,\n\
    the application will bind to all interfaces.\n\nConsider passing in the interface ip address through an environment variable,\n\
    configuration file, or by determining the primary interface(s) IP address.\n\nExample getting the IP address from an environment\
    \ variable `IP_ADDRESS`:\n```\naddr := os.Getenv(\"IP_ADDRESS\")\nlistener, err := net.Listen(\"tcp\", addr)\nif err !=\
    \ nil {\n  log.Fatal(err)\n}\n```\n"
  metadata:
    shortDescription: Binding to an unrestricted IP address
    cwe: CWE-1327
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    security-severity: Low
    category: security
  severity: WARNING
- id: go_sql_rule-concat-sqli
  languages:
  - go
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: fmt.Sprintf(...)
    - pattern-not: 'fmt.Sprintf("...", "...")

        '
  - patterns:
    - pattern: '"..." + $X

        '
    - pattern-not: '"..." + "..."

        '
  - pattern: '($SB : strings.Builder).String()

