- id: python_files_rule-tarfile-unsafe-members
  languages:
  - python
  message: "The application may be vulnerable to a path traversal if it extracts untrusted archive files.\nThis vulnerability\
    \ is colloquially known as 'Zip Slip'. Archive files may contain folders\nwhich,\nwhen extracted, may write outside of\
    \ the intended directory. This is exploited by including\npath traversal characters such as `../../other/directory` to\
    \ overwrite or place files in system\nor application directories.\n\nExtra care must be taken when extracting archive\
    \ files as there are numerous concerns:\n\n- If possible, generate unique filenames instead of using the archives file\
    \ names, as it may be\npossible for users to overwrite files if the filenames are the same.\n- Validate file paths are\
    \ written with a prefixed, known trusted directory.\n- Only process regular files and not symbolic links, as some applications\
    \ may attempt to\nread/follow\nthe symbolic link, leading to arbitrary file read / write vulnerabilities.\n\nExample of\
    \ securely processing an archive file:\n```\nimport tarfile\nimport uuid\n# import os\n\ntar = tarfile.open('some.tar')\n\
    \n# Max number of allowed files in our archive\nmax_files = 10\n# Max size for all files in archive\nmax_size = 1024 *\
    \ 1024 * 10 # 10MB\n# Max size per file in archive\nmax_file_size = 1024 * 1024 # 1MB\n\n# Validate number of files in\
    \ archive\nif len(tar.getmembers()) > max_files:\n    raise Exception(\"Too many files in archive\")\n\ntotal_size = 0\n\
    # Loop over all files to see if we exceed max size\n# if so, do not process any of them.\nfor f in tar.getmembers():\n\
    \    total_size += f.size\n    if total_size >= max_size:\n        raise Exception(\"Archive files exceeded max file size\"\
    )\n\n# Iterate over files now that we know the total size is within limits\nfor f in tar.getmembers():\n    # Internally\
    \ this calls TarInfo.isreg() which ensures\n    # the file is a regular file and not a sym link or directory\n    if not\
    \ f.isfile():\n        continue\n\n    # Optional, set a limit on each file size\n    if f.size > max_file_size:\n   \
    \     raise Exception(f\"File {f.name} too large: {f.size}\")\n\n    # If original names are required, ensure that only\
    \ the\n    # filename is used:\n    # filename = os.path.basename(f.name)\n\n    # More secure, generate a UUID4 value\
    \ instead\n    filename = uuid.uuid4().hex\n\n    # Reset the archive filename to the basename\n    # Newer versions of\
    \ python (3.11.4+) should use:\n    # new_tar = old_tar.replace(name=...new name...)\n    f.name = filename\n\n    # Extract\
    \ the file into a restricted directory, with our\n    # own user's attributes, not the file from the archive\n    tar.extract(f,\
    \ '/opt/app/restricted/', set_attrs=False)\n```\n\nFor more information on tarfile see:\n- https://docs.python.org/3/library/tarfile.html\n"
  metadata:
    cwe: CWE-22
    owasp:
    - A5:2017-Broken Access Control
    - A01:2021-Broken Access Control
    - A01:2025-Broken Access Control
    shortDescription: Improper limitation of a pathname to a restricted directory ('Path Traversal')
    security-severity: Medium
    category: security
  patterns:
  - pattern-inside: 'import tarfile

      ...

      '
  - pattern-either:
    - patterns:
      - pattern-inside: '$TAR = tarfile.open(...)

          ...

          '
      - pattern-either:
        - pattern: $TAR.extractall(...)
        - pattern: tarfile.extractall(..., members=$TAR)
        - pattern: $TAR.extractall(..., members=[])
    - patterns:
      - pattern: tarfile.extractall(...)
      - pattern: tarfile.extractall(..., members=[])
  severity: WARNING
