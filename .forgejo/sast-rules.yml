rules:
- id: csharp_cookies_rule-CookieWithoutHttpOnlyFlag
  languages:
  - csharp
  mode: taint
  pattern-sources:
  - pattern: 'var $COOKIE = new HttpCookie(...);

      '
  pattern-sinks:
  - pattern: $COOKIE
  pattern-sanitizers:
  - pattern: $COOKIE.HttpOnly = true;
  message: 'The `HttpOnly` attribute when set to `true` protects the cookie value from being accessed by

    client side JavaScript such

    as reading the `document.cookie` values. By enabling this protection, a website that is

    vulnerable to

    Cross-Site Scripting (XSS) will be able to block malicious scripts from accessing the cookie

    value from JavaScript.


    Example of protecting an HttpCookie:

    ```

    // Create an HttpOnly cookie.

    HttpCookie someCookie = new HttpCookie("SomeCookieName", "SomeValue");

    someCookie.HttpOnly = true;

    ```


    For more information see:

    https://learn.microsoft.com/en-us/dotnet/api/system.web.httpcookie.httponly


    Session cookies should be configured with the following security directives:


    - [HTTPOnly](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#restrict_access_to_cookies)

    - [Secure](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#restrict_access_to_cookies)

    - [SameSite](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie/SameSite)

    '
  severity: WARNING
  metadata:
    shortDescription: Sensitive cookie without 'HttpOnly' flag
    category: security
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    - A02:2025-Security Misconfiguration
    cwe: CWE-1004
    security-severity: Low
- id: csharp_cookies_rule-CookieWithoutSSLFlag
  languages:
  - csharp
  mode: taint
  pattern-sources:
  - pattern: 'var $COOKIE = new HttpCookie(...);

      '
  pattern-sinks:
  - pattern: $COOKIE
  pattern-sanitizers:
  - pattern: $COOKIE.Secure = true;
  message: 'The `Secure` attribute when set to `true` protects the cookie value from being being

    transmitted over clear text

    communication paths such as HTTP. By enabling this protection, the cookie will only be sent

    over HTTPS.


    Example of protecting an HttpCookie:

    ```

    // Create an HttpOnly cookie.

    HttpCookie someCookie = new HttpCookie("SomeCookieName", "SomeValue");

    someCookie.Secure = true;

    ```


    For more information see:

    https://learn.microsoft.com/en-us/dotnet/api/system.web.httpcookie.secure


    Session cookies should be configured with the following security directives:


    - [HTTPOnly](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#restrict_access_to_cookies)

    - [SameSite](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie/SameSite)

    - [Secure](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies#restrict_access_to_cookies)

    '
  severity: WARNING
  metadata:
    shortDescription: Sensitive cookie in HTTPS session without 'Secure' attribute
    category: security
    owasp:
    - A6:2017-Security Misconfiguration
    - A05:2021-Security Misconfiguration
    - A02:2025-Security Misconfiguration
    cwe: CWE-614
    security-severity: Low
- id: csharp_crypto_rule-CertificateValidationDisabled
  languages:
  - csharp
  patterns:
  - pattern-inside: 'using System.Net;

      ...

      '
  - pattern: ServicePointManager.ServerCertificateValidationCallback += $CALLBACK;
  - metavariable-pattern:
      metavariable: $CALLBACK
      patterns:
      - pattern-either:
        - pattern: $RETURNTYPE $FUNC(...) { return true; }
        - pattern: (...) => true;
  message: 'The `ServicePointManager.ServerCertificateValidationCallback` event has been set

    to always return `true`, which effectively disables the validation of server

    certificates.


    This allows for an adversary who is in between the application and the target host to intercept

    potentially sensitive information or transmit malicious data.


    Remove the callback function that is returning true to allow normal certificate validation to

    proceed.

    When no callback is provided, the client will validate that the certificate name matches the

    hostname

    that was used when creating the request.


    For more information on the `ServerCertificateValidationCallback` property see:

    https://learn.microsoft.com/en-us/dotnet/api/system.net.servicepointmanager.servercertificatevalidationcallback

    '
  severity: WARNING
  metadata:
    shortDescription: Certificate validation disabled
    category: security
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A07:2021-Identification and Authentication Failures
    - A07:2025-Authentication Failures
    cwe: CWE-295
    security-severity: Medium
- id: csharp_crypto_rule-WeakCipherAlgorithm
  patterns:
  - pattern-inside: 'using System.Security.Cryptography;

      ...

      '
  - pattern-either:
    - pattern-regex: .*DES\.Create\(\);
    - pattern: new DESCryptoServiceProvider();
    - pattern-regex: .*TripleDES\.Create\(\);
    - pattern: new TripleDESCryptoServiceProvider();
    - pattern-regex: .*RC2\.Create\(\);
    - pattern: new RC2CryptoServiceProvider();
  message: "DES, TripleDES and RC2 are all considered broken or insecure cryptographic algorithms.\nIf using .NET Framework\
    \ greater than version 6.0 consider using `ChaCha20Poly1305`\ninstead as it is easier and faster than the alternatives\
    \ such as `AES-256-GCM`.\n\nFor older applications, `AES-256-GCM` is recommended, however it has many drawbacks:\n- Slower\
    \ than `ChaCha20Poly1305`.\n- Catastrophic failure if nonce values are reused.\n\nExample using `ChaCha20Poly1305`:\n\
    ```\n// Generate a random key\nbyte[] key = new byte[32];\nRandomNumberGenerator.Fill(key);\n\n// Note nonce values _must_\
    \ be regenerated every time they are used.\nbyte[] nonce = new byte[12];\nRandomNumberGenerator.Fill(nonce);\n\nbyte[]\
    \ authTag = new byte[16];\nbyte[] cipherText;\n\nusing (ChaCha20Poly1305 encryptor = new ChaCha20Poly1305(key))\n{\n \
    \   byte[] plainText = System.Text.Encoding.UTF8.GetBytes(\"Secret text to encrypt\");\n    cipherText = new byte[plainText.Length];\n\
    \    encryptor.Encrypt(nonce, plainText, cipherText, authTag);\n}\n\nusing (ChaCha20Poly1305 decryptor = new ChaCha20Poly1305(key))\n\
    {\n    byte[] output = new byte[cipherText.Length];\n    decryptor.Decrypt(nonce, cipherText, authTag, output);\n    Console.WriteLine(\"\
    Output: {0}\", System.Text.Encoding.UTF8.GetString(output));\n}\n```\n\nExample using `AES-256-GCM`:\n```\n// Generate\
    \ a random key\nbyte[] key = new byte[32];\nRandomNumberGenerator.Fill(key);\n\n// Note nonce values _must_ be regenerated\
    \ every time they are used.\nbyte[] nonce = new byte[AesGcm.NonceByteSizes.MaxSize];\nRandomNumberGenerator.Fill(nonce);\n\
    \nbyte[] authTag = new byte[AesGcm.TagByteSizes.MaxSize];\nbyte[] cipherText;\n\nusing (AesGcm encryptor = new AesGcm(key))\n\
    {\n    byte[] plainText = Encoding.UTF8.GetBytes(\"Secret text to encrypt\");\n    cipherText = new byte[plainText.Length];\n\
    \    encryptor.Encrypt(nonce, plainText, cipherText, authTag);\n}\n\nusing (AesGcm decryptor = new AesGcm(key))\n{\n \
    \   byte[] output = new byte[cipherText.Length];\n    decryptor.Decrypt(nonce, cipherText, authTag, output);\n    Console.WriteLine(\"\
    Output: {0}\",  Encoding.UTF8.GetString(output));\n}\n```\n"
  languages:
  - csharp
  severity: WARNING
  metadata:
    shortDescription: Use of a broken or risky cryptographic algorithm
    category: security
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    cwe: CWE-327
    security-severity: Medium
- id: csharp_crypto_rule-WeakCipherMode
  languages:
  - csharp
  patterns:
  - pattern-inside: 'using System.Security.Cryptography;

      ...

      '
  - metavariable-regex:
      metavariable: $CIPHER
      regex: ^(ECB|CBC|OFB|CFB|CTS)$
  - pattern: CipherMode.$CIPHER
  message: "Cryptographic algorithms provide many different modes of operation, only some of which provide\nmessage integrity.\
    \ Without message integrity it could be possible for an adversary to attempt\nto tamper with the ciphertext which could\
    \ lead to compromising the encryption key. Newer\nalgorithms\napply message integrity to validate ciphertext has not been\
    \ tampered with.\n\nInstead of using an algorithm that requires configuring a `CipherMode`, an algorithm\nthat has built-in\
    \ message integrity should be used. If using .NET Framework greater\nthan version 6.0 consider using `ChaCha20Poly1305`\
    \ or `AES-256-GCM`.\n\nFor older applications, `AES-256-GCM` is recommended, however it has many drawbacks:\n- Slower\
    \ than `ChaCha20Poly1305`.\n- Catastrophic failure if nonce values are re-used.\n\nExample using `ChaCha20Poly1305`:\n\
    ```\n// Generate a random key\nbyte[] key = new byte[32];\nRandomNumberGenerator.Fill(key);\n\nChaCha20Poly1305 encryptor\
    \ = new ChaCha20Poly1305(key);\n\n// Note nonce values _must_ be regenerated every time they are used.\nvar nonce = new\
    \ byte[12];\nRandomNumberGenerator.Fill(nonce);\n\nbyte[] plainText = System.Text.Encoding.UTF8.GetBytes(\"Secret text\
    \ to encrypt\");\nbyte[] cipherText = new byte[plainText.Length];\nvar authTag = new byte[16];\n\nencryptor.Encrypt(nonce,\
    \ plainText, cipherText, authTag);\nbyte[] output = new byte[cipherText.Length];\nencryptor.Decrypt(nonce, cipherText,\
    \ authTag, output);\nConsole.WriteLine(\"Output: {0}\", System.Text.Encoding.UTF8.GetString(output));\n```\n\nExample\
    \ using `AES-256-GCM`:\n```\nvar plaintextBytes = Encoding.UTF8.GetBytes(\"Secret text to encrypt\");\nvar key = new byte[32];\n\
    RandomNumberGenerator.Fill(key);\n\nusing var aes = new AesGcm(key);\nvar nonce = new byte[AesGcm.NonceByteSizes.MaxSize];\n\
    RandomNumberGenerator.Fill(nonce);\n\nvar cipherText = new byte[plaintextBytes.Length];\nvar tag = new byte[AesGcm.TagByteSizes.MaxSize];\n\
    \naes.Encrypt(nonce, plaintextBytes, cipherText, tag);\n\n// Decrypt\nusing (var decrypt = new AesGcm(key))\n{\n    var\
    \ decryptedBytes = new byte[cipherText.Length];\n\n    decrypt.Decrypt(nonce, cipherText, tag, decryptedBytes);\n\n  \
    \  Console.WriteLine(\"Decrypted: {0}\",  Encoding.UTF8.GetString(decryptedBytes));\n}\n```\n"
  severity: WARNING
  metadata:
    shortDescription: Use of a broken or risky cryptographic algorithm
    category: security
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    cwe: CWE-327
    security-severity: Medium
- id: csharp_crypto_rule-WeakHashingFunction
  languages:
  - csharp
  patterns:
  - pattern-either:
    - patterns:
      - metavariable-regex:
          metavariable: $HASH_PROVIDER
          regex: ^(SHA1CryptoServiceProvider|MD5CryptoServiceProvider)$
      - pattern: new $HASH_PROVIDER
    - patterns:
      - metavariable-regex:
          metavariable: $HASH_CLASS
          regex: ^System.Security.Cryptography.(SHA1|MD5)$
      - pattern: $HASH_CLASS.$METHOD();
  message: "Both MD5 and SHA1 hash algorithms have been found to be vulnerable to producing collisions.\nThis means\nthat\
    \ two different values, when hashed, can lead to the same hash value. If the application is\ntrying\nto use these hash\
    \ methods for storing passwords, then it is recommended to switch to a\npassword hashing\nalgorithm such as Argon2id or\
    \ PBKDF2. Currently there is no vetted Argon2id implementation for\nC# so\nit is recommended that PBKDF2 be used until\
    \ one is available.\n\nExample using PBKDF2 to generate and compare passwords:\n```\nconst int SaltSize = 24;\nconst int\
    \ HashSize = 24;\n// number of pbkdf2 iterations, Rfc2898DeriveBytes uses hmac-sha1\n// so set a high iteration count\n\
    const int Iterations = 1_300_000;\nbyte[] salt = new byte[SaltSize];\nRandomNumberGenerator.Fill(salt);\n\nRfc2898DeriveBytes\
    \ pbkdf2 = new Rfc2898DeriveBytes(\"some password\", salt, Iterations);\nbyte[] hashBytes = pbkdf2.GetBytes(HashSize);\n\
    // Store salt and hashedBytes in a data store such as database for authentication\nConsole.WriteLine(\"Hash {0}\", BitConverter.ToString(hashBytes).Replace(\"\
    -\", \"\"));\n// Do a constant time comparison as to not leak data based on timing\nif (CryptographicOperations.FixedTimeEquals(hashBytes,\
    \ hashBytes)) {\n    Console.WriteLine(\"hashes are equal\");\n}\n```\nFor more information on PBKDF2 see:\nhttps://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.rfc2898derivebytes\n\
    \nFor more information on secure password storage see OWASP:\nhttps://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html\n"
  severity: WARNING
  metadata:
    shortDescription: Use of a broken or risky cryptographic algorithm (SHA1/MD5)
    category: security
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    cwe: CWE-327
    security-severity: Medium
- id: csharp_crypto_rule-WeakRNG
  languages:
  - csharp
  patterns:
  - pattern: (Random $RNG).$METHOD(...);
  - focus-metavariable: $RNG
  message: 'Depending on the context, generating weak random numbers may expose cryptographic functions

    which rely on these numbers to be exploitable. When generating numbers for sensitive values

    such as tokens, nonces, and cryptographic keys, it is recommended that the

    `RandomNumberGenerator` class be used.


    Example `RandomNumberGenerator` usage:

    ```

    Int32 randInt = RandomNumberGenerator.GetInt32(32000);

    byte[] randomBytes = new byte[64];

    RandomNumberGenerator.Fill(randomBytes);

    Console.WriteLine("Random Int32: {0}", randInt);

    Console.WriteLine("Random Bytes: {0}", BitConverter.ToString(randomBytes).Replace("-", ""));

    ```


    For more information see:

    https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.randomnumbergenerator

    '
  severity: WARNING
  metadata:
    shortDescription: Use of cryptographically weak Pseudo-Random Number Generator (PRNG)
    category: security
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    cwe: CWE-338
    security-severity: Medium
- id: csharp_csrf_rule-Csrf
  languages:
  - csharp
  patterns:
  - pattern: "[$HTTPMETHOD]\npublic $RET $FOO(...) {\n  ...\n}\n"
  - pattern-not: "[ValidateAntiForgeryToken]\npublic $RET $FOO(...) {\n  ...\n}\n"
  - pattern-not-inside: "[AutoValidateAntiforgeryToken]\nclass $CLASS{\n  ...\n}\n"
  - pattern-not-inside: "[ValidateAntiForgeryToken]\nclass $CLASS{\n  ...\n}\n"
  - metavariable-regex:
      metavariable: $HTTPMETHOD
      regex: Http(Post|Delete|Patch|Put)
  message: 'The application failed to protect against Cross-Site Request Forgery (CSRF)

    due to not including the `[ValidateAntiForgeryToken]` attribute on an

    HTTP method handler that could change user state (usually in the form of POST or PUT

    methods).


    The vulnerability can be exploited by an adversary creating a link or form on a third

    party site and tricking an authenticated victim to access them.


    Add the `[ValidateAntiForgeryToken]` to all methods which take in user data and change

    user state (such as updating a database with a new value). This is especially true for

    functionality such as updating passwords or other security sensitive functions.


    Alternatively, applications can enable a global

    [AutoValidateAntiforgeryTokenAttribute](https://learn.microsoft.com/en-us/dotnet/api/microsoft.aspnetcore.mvc.autovalidateantiforgerytokenattribute)

    filter.


    For more information on ValidateAntiForgeryToken and other CSRF protections in .NET

    see the following URL:

    https://learn.microsoft.com/en-us/aspnet/core/security/anti-request-forgery


    Additionally, consider setting all session cookies to have the `SameSite=Strict` attribute.

    It should be noted that this may impact usability when sharing links across other mediums.

    It is recommended that a two cookie based approach is taken, as outlined in the

    [Top level

    navigations](https://datatracker.ietf.org/doc/html/draft-ietf-httpbis-rfc6265bis-08#section-8.8.2)

    section

    of the SameSite RFC.


    For more information on CSRF see OWASP''s guide:

    https://owasp.org/www-community/attacks/csrf

    '
  severity: WARNING
  metadata:
    shortDescription: Potential Cross-Site Request Forgery (CSRF)
    category: security
    owasp:
    - A5:2017-Broken Access Control
    - A01:2021-Broken Access Control
    - A01:2025-Broken Access Control
    cwe: CWE-352
    security-severity: Medium
- id: csharp_deserialization_rule-InsecureDeserialization
  mode: taint
  pattern-sources:
  - pattern: Request.Cookies[...]
  - pattern: Request.Cookies.Get(...)
  - pattern: Request.Form[...]
  - pattern: Request.Form.Get(...)
  - pattern: Request.Headers[...]
  - pattern: Request.Headers.Get(...)
  - pattern: Request.QueryString[...]
  - pattern: Request.QueryString.Get(...)
  - pattern: Request.Body
  - pattern: $CTX.Request.Cookies[...]
  - pattern: $CTX.Request.Cookies.Get(...)
  - pattern: $CTX.Request.Form[...]
  - pattern: $CTX.Request.Form.Get(...)
  - pattern: $CTX.Request.Headers[...]
  - pattern: $CTX.Request.Headers.Get(...)
  - pattern: $CTX.Request.QueryString[...]
  - pattern: $CTX.Request.QueryString.Get(...)
  - pattern: $CTX.Request.Body
  - pattern: System.IO.File.ReadAllText(...)
  - pattern: System.IO.File.ReadAllTextAsync(...)
  - pattern: System.IO.File.ReadAllLines(...)
  - pattern: System.IO.File.ReadAllLinesAsync(...)
  - pattern: System.IO.File.ReadAllBytes(...)
  - pattern: System.IO.File.ReadAllBytesAsync(...)
  - pattern: System.IO.File.ReadLines(...)
  - pattern: System.IO.File.ReadLinesAsync(...)
  - pattern: System.Environment.GetEnvironmentVariable(...)
  pattern-sinks:
  - pattern: (System.Runtime.Serialization.Formatters.Binary.BinaryFormatter $OBJ).Deserialize(...)
  - pattern: (System.Runtime.Serialization.Formatters.Binary.BinaryFormatter $OBJ).UnsafeDeserialize(...)
  - pattern: (System.Runtime.Serialization.Formatters.Binary.BinaryFormatter $OBJ).UnsafeDeserializeMethod(...)
  - pattern: (System.Runtime.Serialization.Formatters.Soap.SoapFormatter $OBJ).Deserialize(...)
  - pattern: (System.Runtime.Serialization.NetDataContractSerializer $OBJ).Deserialize(...)
  - pattern: (System.Web.UI.LosFormatter $OBJ).Deserialize(...)
  languages:
  - csharp
  message: "Deserialization attacks exploit the process of reading serialized data and turning it back into an\nobject. By\
    \ constructing malicious objects and serializing them, an adversary may attempt to:\n\n- Inject code that is executed\
    \ upon object construction, which occurs during the deserialization process.\n- Exploit mass assignment by including fields\
    \ that are not normally a part of the serialized data but are\n  read in during deserialization.\n\nMicrosoft recommends\
    \ no longer using the following serialization formats:\n\n- BinaryFormatter\n- SoapFormatter\n- NetDataContractSerializer\n\
    - LosFormatter\n- ObjectStateFormatter\n\nConsider safer alternatives such as serializing data in the JSON format. Ensure\
    \ any format chosen allows\nthe application to specify exactly which object types are allowed to be deserialized. Additionally,\
    \ when\ndeserializing, never deserialize to base object types like `Object` and only cast to the exact object\ntype that\
    \ is expected.\n\nTo protect against mass assignment, only allow deserialization of the specific fields that are required.\n\
    If this is not easily done, consider creating an intermediary type that can be serialized with only the\nnecessary fields\
    \ exposed.\n\nFor more information see Microsoft's deserialization security guide:\nhttps://learn.microsoft.com/en-us/dotnet/standard/serialization/binaryformatter-security-guide\n\
    \nFor more details on deserialization attacks in general, see OWASP's guide:\nhttps://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html\n\
    \nIt should be noted that [tools exist](https://github.com/pwntester/ysoserial.net) to automatically create\nexploit code\
    \ for these vulnerabilities.\n"
  metadata:
    shortDescription: Deserialization of potentially untrusted data
    category: security
    cwe: CWE-502
    owasp:
    - A8:2017-Insecure Deserialization
    - A08:2021-Software and Data Integrity Failures
    - A08:2025-Software or Data Integrity Failures
    security-severity: High
  severity: WARNING
- id: csharp_endpoint_rule-UnvalidatedRedirect
  languages:
  - csharp
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: $SRC
    - pattern-inside: 'public $RET $FUNC(...,$SRC,...){...}

        '
  - patterns:
    - pattern: $SRC
    - pattern-inside: 'if (Uri.TryCreate(..., ..., $SRC)){

        ...

        }

        '
  pattern-sanitizers:
  - pattern: Url.Action(...)
  - pattern: Url.HttpRouteUrl(...)
  - pattern: Url.RouteUrl(...)
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern: return $METHOD(...)
          - pattern: return new $METHOD(...)
        - pattern: "if (!Url.IsLocalUrl(...)) {\n    ...\n    return $METHOD(...)\n}\n"
      - patterns:
        - pattern-not-inside: "if (Url.IsLocalUrl(...)) {\n    ...\n}\n"
        - pattern-not-inside: "if (!Url.IsLocalUrl(...)) {\n    return $X\n}\n...\n"
        - pattern-either:
          - pattern: $METHOD(...)
          - pattern: new $METHOD(...)
        - metavariable-pattern:
            metavariable: $METHOD
            pattern-either:
            - pattern: Redirect
            - pattern: RedirectPermanent
            - pattern: RedirectToRoute
            - pattern: RedirectToRoutePermanent
            - pattern: RedirectResult
  message: 'The application may allow open redirects if created using user supplied input. Open redirects

    are

    commonly

    abused in phishing attacks where the original domain or URL looks like a legitimate link, but

    then

    redirects a user to a malicious site. An example would be

    `https://example.com/redirect?url=https://%62%61%64%2e%63%6f%6d%2f%66%61%6b%65%6c%6f%67%69%6e`

    which,

    when decoded, turns into `bad.com/fakelogin`.


    Never redirect a client based on user input. It is recommended that the list of target links

    to

    redirect a user to are contained server side, and retrieved using a numerical value

    as an index to return the link to be redirected to. For example, `/redirect?id=1` would cause

    the

    application to look up the `1` index and return a URL such as `https://example.com`. This URL

    would

    then be used to redirect the user, using the 301 response code and `Location` header.


    For more information on open redirects see OWASP''s guide:

    https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html

    '
  metadata:
    shortDescription: URL redirection to untrusted site 'open redirect'
    category: security
