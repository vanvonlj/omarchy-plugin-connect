  message: "The application was found creating files in shared system temporary directories\n(`/tmp` or `/var/tmp`) without\
    \ using the `tempfile.TemporaryFile` function. Depending\non how the application uses this temporary file, an attacker\
    \ may be able to create\nsymlinks that point to other files prior to the application creating or writing\nto the target\
    \ file, leading to unintended files being created or overwritten.\n\nExample using `tempfile.TemporaryFile` to write a\
    \ file:\n```\nimport tempfile\n\n# Open a new temporary file using a context manager\nwith tempfile.TemporaryFile() as\
