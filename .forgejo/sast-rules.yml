    - pattern: os.OpenFile(...,$MASK)
    - pattern: os.WriteFile(...,$MASK)
  - metavariable-comparison:
      metavariable: $MASK
      comparison: int($MASK) > 0o640
  message: "The application was found setting file permissions to overly permissive values. Consider\nusing the following\
    \ values if the application user is the only process to access\nthe file:\n\n- 0400 - read only access to the file\n-\
    \ 0200 - write only access to the file\n- 0600 - read/write access to the file\n\nExample creating a file with read/write\
    \ permissions for the application user:\n```\nf, err := os.OpenFile(\"file.txt\", os.O_CREATE, 0600)\nif err != nil {\n\
    \  log.Fatal(err)\n}\ndefer f.Close()\n// continue to work with file here\n```\n\nFor all other values please see:\nhttps://en.wikipedia.org/wiki/File-system_permissions#Numeric_notation\n"
  metadata:
    shortDescription: Incorrect permission assignment for critical resource
    cwe: CWE-732
    owasp:
    - A5:2017-Broken Access Control
