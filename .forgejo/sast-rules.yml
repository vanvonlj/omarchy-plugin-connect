      - pattern-either:
        - patterns:
          - pattern: $VAR.XPath = <...$ARG...>;
          - pattern-not: $VAR.XPath = "..."
        - patterns:
          - pattern: new XmlSchemaXPath { XPath = <...$ARG...> };
          - focus-metavariable: $ARG
  message: "XPath injection is a vulnerability that can allow an adversary to inject or modify how an XML\nquery\nis structured.\
    \ Depending on the logic of the original query, this could lead to adversaries\nextracting unauthorized information or\
    \ in rare cases bypassing authorization checks.\n\nIt is recommended that LINQ to XML is used instead of XPath for querying\
    \ XML documents. Care\nmust be taken to **not** call these LINQ functions with user input as they can still lead to\n\
    XPath\ninjection:\n\n- `XPathEvaluate`\n- `XPathSelectElement`\n- `XPathSelectElements`\n\nExample using LINQ to XML to\
    \ safely extract the first user from a list of users:\n```\n// XDocument is safe from XXE attacks as the resolver is disabled\
    \ by default\nXDocument doc = XDocument.Load(\"users.xml\");\nXNamespace ns = \"urn:users-schema\";\n\nstring userInput\
    \ = \"LastName\";\n\n// Get all the users.\nvar user = doc.Descendants(ns + \"user\")\n               .Select(u => new\
    \ {\n                  FirstName = (string)u.Element(ns + \"first-name\"),\n                  LastName = (string)u.Element(ns\
    \ + \"last-name\")\n               }).Where(u => u.LastName == userInput).FirstOrDefault();\n\nConsole.WriteLine(user.FirstName\
    \ + \" \" + user.LastName);\n```\n\nFor more information on LINQ to XML security see:\nhttps://learn.microsoft.com/en-us/dotnet/standard/linq/linq-xml-security\n\
    \nFor more information on XML security see OWASP's guide:\nhttps://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html#net\n"
  severity: INFO
  metadata:
    shortDescription: Improper neutralization of data within XPath expressions ('XPath Injection')
