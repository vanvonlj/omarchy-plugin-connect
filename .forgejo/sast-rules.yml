  message: "Detected use of the wildcard character in a system call that spawns a shell. This subjects the\nwildcard to normal\
    \ shell expansion, which can have unintended consequences if there exist any\nnon-standard file names. For instance, a\
    \ file named `-e sh script.sh` could cause issues when \nexpanded by the shell and executed as a command. Consider using\
    \ a different method to achieve \nthe same result, such as using the `glob` module to expand the wildcard before passing\
    \ it to the\nsystem call. Or if the command is static, consider hardcoding the command instead of using a\nwildcard.\n\
    \nFor example, the below code uses the glob module to expand the wildcard and get a list of all \nCSV files in the current\
    \ directory. This list is then used in the subprocess.run call, instead of a \nwildcard. This avoids the potential issues\
    \ that can arise from using a wildcard in a system call.\n```\nimport glob\nimport subprocess\n\n# Secure way to process\
    \ all CSV files\nfiles = glob.glob('*.csv')\nfor file in files:\n  subprocess.run(['process_data', file])\n```\n"
