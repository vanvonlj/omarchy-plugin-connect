- id: go_blocklist_rule-blocklist-des
  languages:
  - go
  patterns:
  - pattern: 'import "crypto/des"

      '
  message: "The DES algorithm has not been recommended for over 15 years and was withdrawn from NIST (FIPS\n46-3) in 2005.\
    \ It is recommended that an algorithm that provides message integrity be used\ninstead. Consider using `XChaCha20Poly1305`\
    \ or `AES-256-GCM`.\n\nFor older applications, `AES-256-GCM` is recommended, however it has many drawbacks:\n- Slower\
    \ than `XChaCha20Poly1305`\n- Smaller nonce value size compared to `XChaCha20Poly1305`\n- Catastrophic failure if nonce\
    \ values are re-used\n\nExample using\n[XChaCha20Poly1305](https://pkg.go.dev/golang.org/x/crypto/chacha20poly1305#NewX):\n\
    ```\nkey := make([]byte, chacha20poly1305.KeySize)\nif _, err := io.ReadFull(rand.Reader, key); err != nil {\n  log.Fatal(err)\n\
    }\n\n// NewX is a variant that uses longer nonce values for better security\naead, err := chacha20poly1305.NewX(key)\n\
    if err != nil {\n  log.Fatal(err)\n}\n\nvar encrypted = []byte{}\nvar nonce = []byte{}\n\n// Encryption routine\n{\n \
    \ msg := []byte(\"Some secret message\")\n  nonce = make([]byte, aead.NonceSize())\n  if _, err := io.ReadFull(rand.Reader,\
    \ nonce); err != nil {\n    log.Fatal(\"failed to generate nonce\")\n  }\n\n  encrypted = aead.Seal(nil, nonce, msg, nil)\n\
    }\n\n// Decryption routine\n{\n  if len(encrypted) < aead.NonceSize() {\n    log.Fatal(\"incorrect ciphertext length\"\
    )\n  }\n\n  msg, err := aead.Open(nil, nonce, encrypted, nil)\n  if err != nil {\n    log.Fatal(err)\n  }\n  fmt.Printf(\"\
    Decrypted: %s\\n\", msg)\n}\n```\n\nExample using [AES-256-GCM](https://pkg.go.dev/crypto/cipher#NewGCM):\n```\n// 32\
    \ byte keys will configure AES-256\nkey := make([]byte, 32)\nif _, err := io.ReadFull(rand.Reader, key); err != nil {\n\
    \  log.Fatal(err)\n}\n\nblockCipher, err := aes.NewCipher(key)\nif err != nil {\n  log.Fatal(err)\n}\n\naead, err := cipher.NewGCM(blockCipher)\n\
    if err != nil {\n  log.Fatal(err)\n}\n\nvar encrypted = []byte{}\nvar nonce = []byte{}\n// Encryption routine\n{\n  msg\
    \ := []byte(\"Some secret message\")\n  // note that the key must be rotated every 2^32 random nonces used otherwise\n\
    \  // cipher text could be repeated\n  nonce = make([]byte, 12)\n  if _, err := io.ReadFull(rand.Reader, nonce); err !=\
    \ nil {\n    log.Fatal(err)\n  }\n  encrypted = aead.Seal(nil, nonce, msg, nil)\n}\n\n// Decryption routine\n{\n  msg,\
    \ err := aead.Open(nil, nonce, encrypted, nil)\n  if err != nil {\n    log.Fatal(err)\n  }\n  fmt.Printf(\"Decrypted:\
    \ %s\\n\", msg)\n}\n```\n"
  metadata:
    shortDescription: Use of a broken or risky cryptographic algorithm
    cwe: CWE-327
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    security-severity: Medium
    category: security
  severity: WARNING
- id: go_blocklist_rule-blocklist-md5
  languages:
  - go
  patterns:
  - pattern: 'import "crypto/md5"

      '
  message: "The MD5 message-digest algorithm has been cryptographically broken and is unsuitable for\nfurther use. The MD5\
    \ hash algorithm has been found to be vulnerable to producing collisions.\nThis means that two different values, when\
    \ hashed, can lead to the same hash value. It is\nrecommended that the SHA-3 or BLAKE2 family of algorithms be used for\
    \ non-password based\ncryptographic hashes instead. For password based cryptographic hashes,  consider using the\nbcrypt\
    \ or Argon2id family of cryptographic hashes.\n\nHashing values using [BLAKE2](https://pkg.go.dev/golang.org/x/crypto/blake2b):\n\
    ```\nfileContents := []byte(\"some file contents to create hash for\")\nblake2bHasher, err := blake2b.New512(nil)\nif\
    \ err != nil {\n  log.Fatal(err)\n}\nhashedValue := blake2bHasher.Sum(fileContents)\nfmt.Printf(\"%s\\n\", hex.EncodeToString(hashedValue))\n\
    ```\n\nHashing and securely comparing passwords using\n[Argon2id](https://pkg.go.dev/golang.org/x/crypto/argon2#hdr-Argon2id):\n\
    ```\ntype argonParameters struct {\n  variant     string\n  version     int\n  memory      uint32\n  iterations  uint32\n\
    \  parallelism uint8\n  saltLength  uint32\n  keyLength   uint32\n}\n\nfunc (a argonParameters) StringFormat(salt, derivedKey\
    \ []byte) string {\n  encodedSalt := base64.RawStdEncoding.EncodeToString(salt)\n  encodedKey := base64.RawStdEncoding.EncodeToString(derivedKey)\n\
    \n  return fmt.Sprintf(\"$argon2id$v=%d$m=%d,t=%d,p=%d$%s$%s\",\n    argon2.Version,\n    a.memory,\n    a.iterations,\n\
    \    a.parallelism,\n    encodedSalt,\n    encodedKey,\n  )\n}\n\nfunc main() {\n  // Initialize Argon2id parameters\n\
    \  p := argonParameters{\n    memory:      64 * 1024,\n    iterations:  3,\n    parallelism: 2,\n    saltLength:  16,\n\
    \    keyLength:   32,\n  }\n\n  // Generate random salt (to be stored alongside derived hash key)\n  salt := make([]byte,\
    \ p.saltLength)\n  if _, err := io.ReadFull(rand.Reader, salt); err != nil {\n    log.Fatal(err)\n  }\n\n  usersPassword\
    \ := []byte(\"User's Very S3cur3P4ss@rd@#$%\")\n\n  var derivedKey []byte\n  // Create key hash derived from user's password\n\
    \  {\n    derivedKey = argon2.IDKey(usersPassword, salt, p.iterations, p.memory, p.parallelism,\np.keyLength)\n    //\
    \ store p.StringFormat(...) result in a data store...\n    fmt.Printf(\"%s\\n\", p.StringFormat(salt, derivedKey))\n \
    \ }\n\n  // Verify a user's password against key\n  {\n    keyToCompare := argon2.IDKey(usersPassword, salt, p.iterations,\
    \ p.memory, p.parallelism,\np.keyLength)\n\n    // Use subtle.ConstantTimeCompare(..., ...) to ensure no side channel\
    \ leaks used in timing\nattacks\n    if subtle.ConstantTimeCompare(derivedKey, keyToCompare) == 1 {\n      fmt.Printf(\"\
    Passwords match\\n\")\n    } else {\n      fmt.Printf(\"Passwords do not match\\n\")\n    }\n  }\n}\n```\n\nFor more information\
    \ on password storage see OWASP's guide:\nhttps://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html\n"
  metadata:
    shortDescription: Use of a broken or risky cryptographic algorithm
    cwe: CWE-327
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    security-severity: Medium
    category: security
  severity: WARNING
