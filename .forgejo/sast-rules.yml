- id: python_eval_rule-eval
  languages:
  - python
  message: "The application was found calling the `eval` function with non-literal data. If the variable contains \nuser-controlled\
    \ data, either partially or fully, an adversary could compromise the entire system by \nexecuting arbitrary Python code.\n\
    \nTo remediate this issue, remove all calls to `eval` and consider alternative methods for executing \nthe necessary business\
    \ logic. There is almost no safe method of calling `eval` with user-supplied input.\n\nIf the application only needs to\
    \ convert strings into objects, consider using `json.loads`. In \nsome cases `ast.literal_eval` is recommended, but this\
    \ should be avoided as it can still suffer \nfrom other issues such as the ability for malicious code to crash the python\
    \ interpreter or application.\n\nExample using `json.loads`` to load in arbitrary data to create data structures:\n```\n\
