        pattern-either:
        - pattern: tls.VersionTLS11
        - pattern: tls.VersionTLS10
  - patterns:
    - pattern-inside: 'tls.Config{...}

        '
    - pattern: 'MaxVersion: $ANYVAL

        '
    - pattern-not-inside: 'tls.Config{..., MinVersion: ..., ...}

        '
  message: "TLS versions 1.1 and 1.0 were deprecated by the IETF in June 2018 due to \na number of attacks against the vulnerable\
    \ versions. Use of a deprecated \nTLS version may result in the unauthorized retrieval of sensitive \ninformation. It\
    \ is strongly recommended that all TLS connections\nuse TLS 1.3 as Go will automatically choose the most secure cipher\
    \ when \nnegotiating the TLS handshake with client or servers. TLS 1.3 cipher suites \nare configured to require Perfect\
    \ Forward Secrecy (PFS). PFS is an important \nproperty as it will ensure that past encrypted transmissions could not\
    \ be\ndecrypted if the TLS certificate was compromised.\n\nExample using TLS 1.3 for a Go server:\n```\ncert, err := tls.LoadX509KeyPair(\"\
    server.crt\", \"server.key\")\nif err != nil {\n  log.Fatal(err)\n}\n\ncfg := &tls.Config{Certificates: []tls.Certificate{cert},\
    \ \n                  MinVersion: tls.VersionTLS13}\n\nsrv := &http.Server{\n  Addr:         \":8999\",\n  TLSConfig:\
    \    cfg,\n  ReadTimeout:  time.Minute,\n  WriteTimeout: time.Minute,\n}\nlog.Fatal(srv.ListenAndServeTLS(\"cert.pem\"\
    , \"key.pem\"))\n```\n"
  metadata:
    shortDescription: Selection of less-secure algorithm during negotiation ('algorithm downgrade')
    cwe: CWE-757
    owasp:
    - A3:2017-Sensitive Data Exposure
    - A02:2021-Cryptographic Failures
    - A04:2025-Cryptographic Failures
    security-severity: Medium
    category: security
  severity: WARNING
- id: go_crypto_rule-weakkeystrength
  languages:
  - go
  patterns:
  - pattern-either:
    - pattern: 'rsa.GenerateKey(..., $ARG)

        '
  - metavariable-comparison:
      metavariable: $ARG
      comparison: $ARG < 2048
  message: "The application is generating an RSA key that is less than the recommended 2048 bits.\nThe National Institute\
    \ of Standards and Technology (NIST) deprecated signing Digital\nCertificates that contained RSA Public Keys of 1024 bits\
    \ in December 2010. While\n1024-bit RSA keys have not been factored yet, advances in compute may make it possible\nin\
    \ the near future.\n\nTo generate an RSA key of 2048 pass the number of bits as the second parameter to\nthe `rsa.GenerateKey`\
    \ function:\n```\nimport (\n  \"crypto/rand\"\n  \"crypto/rsa\"\n)\n\nfunc generate() {\n  key, err := rsa.GenerateKey(rand.Reader,\
    \ 2048)\n  if err != nil {\n    log.Fatal(err)\n  }\n}\n```\n"
  metadata:
    shortDescription: Inadequate encryption strength
    cwe: CWE-326
    owasp:
    - A3:2017-Sensitive Data Exposure
