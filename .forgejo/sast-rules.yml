- id: python_escaping_rule-jinja2-autoescape-false
  languages:
  - python
  message: "The application was found using Jinja2 `Environment` without autoescaping enabled. If using in\nthe context of\
    \ HTML this could lead to Cross-Site Scripting (XSS) attacks when rendering with\nuser-supplied input.\n\nUnfortunately,\
    \ Jinja2 does not support context-aware escaping, meaning it is insufficient to\nprotect against\nXSS for the various\
    \ web contexts. It is important to encode the data depending on the specific\ncontext\nit\nis used in. There are at least\
    \ six context types:\n\n- Inside HTML tags `<div>context 1</div>`\n- Inside attributes: `<div class=\"context 2\"></div>`\n\
    - Inside event attributes `<button onclick=\"context 3\">button</button>`\n- Inside script blocks: `<script>var x = \"\
    context 4\"</script>`\n- Unsafe element HTML assignment: `element.innerHTML = \"context 5\"`\n- Inside URLs: `<iframe\
    \ src=\"context 6\"></iframe><a href=\"context 6\">link</a>`\n\nScript blocks alone have multiple ways they need to be\
    \ encoded. Extra care must be taken if\nuser input\nis ever output inside of script tags.\n\nUser input that is displayed\
    \ within the application must be encoded, sanitized or validated\nto ensure it cannot be treated as HTML or executed as\
    \ Javascript code. Care must also be\ntaken\nto not mix server-side templating with client-side templating, as the server-side\
    \ templating\nwill\nnot encode things like {{ 7*7 }} which may execute client-side templating features.\n\nIt is _NOT_\
    \ advised to encode user input prior to inserting into a data store. The data will\nneed to be\nencoded depending on context\
    \ of where it is output. It is much safer to force the displaying\nsystem to\nhandle the encoding and not attempt to guess\
    \ how it should be encoded.\n\nTo handle different contexts, one approach would be to write custom Jinja2 filters. Below\
    \ is\nan example\nthat escapes or encodes links and potentially malicious script, note this does not include\nother contexts\n\
    such as CSS or attributes:\n```\nfrom jinja2 import Environment, select_autoescape, FileSystemLoader\nfrom jinja2 import\
    \ pass_eval_context\nfrom markupsafe import Markup, escape\n\n@pass_eval_context\ndef escape_link(eval_ctx, value):\n\
    \    bad_link = \"#JinjatmplZ\"\n    # Block any values that start with // as that could be used to inject\n    # links\
    \ to third party pages see:\nhttps://en.wikipedia.org/wiki/Wikipedia:Protocol-relative_URL\n    if value.startswith('//'):\n\
    \        return bad_link\n\n    # Only allow relative links\n    # if you want to allow links that start with http or\
    \ ws replace with below:\n    # if not value.startswith('/'): and not value.startswith('http') and not\nvalue.startswith('ws')\n\
    \    if not value.startswith('/'):\n        return bad_link\n\n    # Alternatively, you could only call escape if autoescape\
    \ is true\n    # if eval_ctx.autoescape:\n    #    return escape(value)\n    # else\n    #    return value\n\n    return\
    \ escape(value)\n\n# Create a replacement table\njs_replacement = str.maketrans({\n        '\"':  \"\\\\u0022\",\n   \
    \     '`':  \"\\\\u0060\",\n        '&':  \"\\\\u0026\",\n        '\\'': \"\\\\u0027\",\n        '+':  \"\\\\u002b\",\n\
    \        '/':  \"\\\\/\",\n        '<':  \"\\\\u003c\",\n        '>':  \"\\\\u003e\",\n        '\\\\': \"\\\\\\\\\",\n\
    \        '(': \"\\\\u0028\",\n        ')': \"\\\\u0029\",\n    })\n\n@pass_eval_context\ndef escape_js(eval_ctx, value):\n\
    \    \"\"\"\n    Escape the input for use in <script> context, USE WITH CAUTION\n    It is strongly recommended to _never_\
    \ pass user-supplied input to\n    the JavaScript context. This may still be unsafe depending where\n    used, it does\
    \ not consider characters used  in regular expressions\n    for example.\n    \"\"\"\n\n    #if eval_ctx.autoescape:\n\
    \    #    value = escape(value)\n    # Escape by default\n    value = escape(value)\n    # Translate any potential characters\
    \ using our translation table\n    return value.translate(js_replacement)\n\n# Create our environment, setting autoescape\
    \ to use the default\n# select_autoescape function\nenv = Environment(\n    loader=FileSystemLoader(os.getcwd()+\"/template\"\
    ),\n    autoescape=select_autoescape,\n)\n# Add an escape link filter to be used in our template\nenv.filters[\"escape_link\"\
    ] = escape_link\nenv.filters[\"escape_js\"] = escape_js\n# Load our template file\ntemplate = env.get_template(\"mytemplate.html\"\
    )\n# Render with different variables which call our filters\nprint(template.render(\n    html_context=\"<img src=x onerror=alert(1)>\"\
    ,\n    link_context=\"/# onclick=alert(1)<script>alert(1)</script>\",\n    script_context=\"alert(1);alert`1`\",)\n)\n\
    \n# Sample template:\n\"\"\"\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <title>My Webpage</title>\n</head>\n<body>\n\
    \    <h1>My Webpage</h1>\n    {{ html_context }}\n    <a href=\"{{ link_context | escape_link }}\">link</a>\n    <script>{{\
    \ script_context | escape_js }}</script>\n</body>\n</html>\n\"\"\"\n```\n\nFor more information on autoescape see:\n-\
    \ https://jinja.palletsprojects.com/en/3.1.x/api/#autoescaping\n\nFor more information on XSS see OWASP:\n- https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html\n"
  metadata:
    cwe: CWE-116
    owasp:
    - A7:2017-Cross-Site Scripting (XSS)
    - A03:2021-Injection
    - A05:2025-Injection
    category: security
    shortDescription: Improper encoding or escaping of output
    security-severity: Medium
  patterns:
  - pattern-inside: 'import jinja2

      ...

      '
  - pattern-not: jinja2.Environment(..., autoescape=True, ...)
  - pattern-not: jinja2.Environment(..., autoescape=jinja2.select_autoescape(...),...)
  - pattern-not: jinja2.Environment(..., autoescape=select_autoescape(...), ...)
  - pattern: jinja2.Environment(...)
  severity: WARNING
- id: python_escaping_rule-use-of-mako-templates
  languages:
  - python
  message: "The application was found using mako templates without `default_filters`\nbeing passed to the `Template` or `TemplateLookup`\
    \ constructors. If using \nin the context of HTML, this could lead to Cross-Site Scripting (XSS) attacks \nwhen rendering\
    \ with user-supplied input.\n\nUnfortunately, Jinja2 does not support context-aware escaping, meaning it\nis insufficient\
    \ to protect against XSS for the various web contexts. It is \nimportant to encode the data depending on the specific\
    \ context it is used in. \nThere are at least six context types:\n\n- Inside HTML tags `<div>context 1</div>`\n- Inside\
    \ attributes: `<div class=\"context 2\"></div>`\n- Inside event attributes `<button onclick=\"context 3\">button</button>`\n\
    - Inside script blocks: `<script>var x = \"context 4\"</script>`\n- Unsafe element HTML assignment: `element.innerHTML\
    \ = \"context 5\"`\n- Inside URLs: \n`<iframe src=\"context 6\"></iframe><a href=\"context 6\">link</a>`\n\nScript blocks\
    \ alone have multiple ways they need to be encoded. Extra care\nmust be taken if user input is ever output inside of script\
    \ tags.\n\nUser input that is displayed within the application must be encoded,\nsanitized or validated to ensure it cannot\
    \ be treated as HTML or executed \nas Javascript code. Care must also be taken to not mix server-side templating \nwith\
    \ client-side templating, as the server-side templating will not encode things \nlike {{ 7*7 }} which may execute client-side\
    \ templating features.\n\nIt is _NOT_ advised to encode user input prior to inserting into a data\nstore. The data will\
    \ need to be encoded depending on context of where it is output. \nIt is much safer to force the displaying system to\
    \ handle the encoding and \nnot attempt to guess how it should be encoded.\n\nTo handle different contexts, one approach\
    \ would be to write custom mako\nfilters. Below is an example that escapes or encodes links and \npotentially malicious\
    \ script, note this does not include other contexts \nsuch as CSS or attributes:\n```\n# filters.py module:\n\ndef escape_link(value):\n\
    \    bad_link = \"#JinjatmplZ\"\n    # Block any values that start with // as that could be used to inject\n    # links\
    \ to third party pages see:\nhttps://en.wikipedia.org/wiki/Wikipedia:Protocol-relative_URL\n    if value.startswith('//'):\n\
    \        return bad_link\n\n    # Only allow relative links\n    # if you want to allow links that start with http or\
    \ ws replace with below:\n    # if not value.startswith('/'): and not value.startswith('http') and not\nvalue.startswith('ws')\n\
    \    if not value.startswith('/'):\n        return bad_link\n\n    return value\n\n# Create a replacement table\njs_replacement\
    \ = str.maketrans({\n    '\\0': \"\\\\u0000\",\n    '\\t': \"\\\\t\",\n    '\\n': \"\\\\n\",\n    '\\v': \"\\\\u000b\"\
    ,\n    '\\f': \"\\\\f`\",\n    '\\r': \"\\\\r\",\n    '\"':  \"\\\\u0022\",\n    '`':  \"\\\\u0060\",\n    '&':  \"\\\\\
    u0026\",\n    '\\'': \"\\\\u0027\",\n    '+':  \"\\\\u002b\",\n    '/':  \"\\\\/\",\n    '<':  \"\\\\u003c\",\n    '>':\
    \  \"\\\\u003e\",\n    '\\\\': \"\\\\\\\\\",\n    '(': \"\\\\u0028\",\n    ')': \"\\\\u0029\",\n})\n\ndef escape_js(value):\n\
    \    # Escape the input for use in <script> context, USE WITH CAUTION\n    # It is strongly recommended to never pass\
    \ user-supplied input to\n    # the JavaScript context.\n\n    # Translate any potential characters using our translation\
    \ table\n    return value.translate(js_replacement)\n\n#####################################################################\n\
    # main module:                                                      #\n#####################################################################\n\
    from mako.template import Template\n\n# Define our template, note the calls to our custom filters depending\n# on context\n\
    template_text = \"\"\"\n\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <title>My Webpage</title>\n</head>\n<body>\n\
    \    <h1>My Webpage</h1>\n    ${html_context}\n    <a href=\"${link_context | escape_link}\">link</a>\n    <script>${script_context\
    \ | escape_js}</script>\n</body>\n</html>\n\"\"\"\n\n# Load our template with default filters and our imported filters\
    \ for\n# usage in template files\nt = Template(template_text,\n            # By default enable the html filter with 'h'\n\
    \            default_filters=['h'],\n            # Import our custom filters\n            imports=[\"from filters import\
    \ escape_link, escape_js\"])\n\n# Render our template\nprint(t.render(html_context=\"<img src=x onerror=alert(1)>\",\n\
    \    link_context=\"/# onclick=alert(1)<script>alert(1)</script>\",\n    script_context=\"alert(1)<img src=x onerror=alert(1)>\"\
    ,)\n)\n```\n"
