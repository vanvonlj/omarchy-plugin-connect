  severity: WARNING
  message: "The application was found calling the `eval` function OR Function()\n  constructor OR setTimeout() OR setInterval()\
    \ methods. If the\n\n  variables or strings or functions passed to these methods contains user-supplied input, an adversary\
    \ could attempt to execute arbitrary\n\n  JavaScript\n\n  code. This could lead to a full system compromise in Node applications\
    \ or Cross-site Scripting\n\n  (XSS) in web applications.\n\n\n  To remediate this issue, remove all calls to above methods\
    \ and consider alternative methods for\n\n  executing\n\n  the necessary business logic. There is almost no safe method\
    \ of calling `eval` or other above stated sinks with\n\n  user-supplied input.\n\n  Instead, consider alternative methods\
    \ such as using property accessors to dynamically access\n\n  values.\n\n\n  Example using property accessors to dynamically\
    \ access an object's property:\n\n  ```\n\n  // Define an object\n\n  const obj = {key1: 'value1', key2: 'value2'};\n\n\
    \  // Get key dynamically from user input\n\n  const key = getUserInput();\n\n  // Check if the key exists in our object\
    \ and return it, or a default empty string\n\n  const value = (obj.hasOwnProperty(key)) ? obj[key] : '';\n\n  // Work\
    \ with the value\n\n  ```\n\n\n  For more information on why not to use `eval`, and alternatives see:\n\n  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval#never_use_eval!\n\
    \n  Other References:\n\n  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/Function\n\
    \n  - https://developer.mozilla.org/en-US/docs/Web/API/setTimeout\n\n  - https://developer.mozilla.org/en-US/docs/Web/API/setInterval\n"
