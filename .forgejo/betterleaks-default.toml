# Default betterleaks config for every repo scan.py runs in (SCAN-87).
# MANAGED FILE — synced by ops/forgejo-ci/rollout.py beside scan.py as
# .forgejo/betterleaks-default.toml. Edit it in homelab-platform, not here.
#
# How scan.py uses it (see secrets_config() in scan.py):
#   - repo has no .betterleaks.toml   -> `--config` this file;
#   - repo has one                    -> a temp copy of the repo's file with
#     its `useDefault = true` swapped for `[extend] path` to this file, so the
#     repo's own rules and allowlists apply on top of these, and this file's
#     own `useDefault = true` brings in betterleaks' built-ins;
#   - this file, or the repo's extend target, missing or unparseable
#     -> the secrets layer FAILS. betterleaks exits 1 with no output, which
#     scan.py used to read as "no findings".
#
# The rules and allowlists below started as scan-console's SCAN-75
# .betterleaks.toml; SCAN-109 added the local-host allowlists and __NAME__.
# Every allowlist is on the secret's VALUE or the HOST it unlocks, never on a
# path: scan-console ships the same rules to tenant scans, where the tenant
# chooses the paths. To accept a documented example in one repo, add a value
# or line allowlist to that repo's own .betterleaks.toml — never widen this
# one.
# SCAN-109's db/postgres name exemption is NOT tenant-safe: it rests on these
# repos running no k8s Service by those names, which a tenant's cluster may.
# It was not mirrored to scan-console's .betterleaks.toml; if that copy is
# ever synced from this one, drop the names there and keep loopback only.
#
# betterleaks 1.1.2's defaults flagged no password in a connection string at
# all — the 2026-09-25 dependency audit had to grep for them. 1.8.0 added
# generic-password and generic-credential-uri, which flag some (and the
# placeholders these rules allowlist). They are disabled below (SCAN-127):
# that keeps the gate's coverage what it was on 1.1.2, where these rules do
# the job with placeholder allowlists. test_secrets_config.py section 4a
# fails on betterleaks 1.8+ if they come back on, with or without a repo
# .betterleaks.toml in the chain.

[extend]
useDefault = true
disabledRules = ["generic-password", "generic-credential-uri"]

# .NET/ADO, Npgsql, SqlClient and SQL Server JDBC (semicolon-separated)
# strings; standard JDBC's ?user=…&password=… is not covered. The leading
# ";" is what makes it a connection string and not any `password=` in prose
# or a CLI flag; a string that STARTS with Password= is not caught.
#   - No space on either side of "=": code writes `x; password = input;` on
#     one line, connection strings write Password=… . So `Password = x` inside
#     a real connection string is missed, a trade against every
#     `;`-terminated language reading 'failed'. Spaces and tabs (never \s,
#     which spans newlines) are allowed only before the key.
#   - An opening quote is skipped, so a quoted value (valid Npgsql/SqlClient
#     syntax) is caught too.
#   - The value stops at a backslash in both rules: in source,
#     `Password=REPLACE_ME\"` is an escaped quote, and capturing the `\` would
#     dodge the allowlist.
#
# Allowlists are PER RULE, so the defaults behave exactly as without this
# file. Each matches the whole captured password only:
#   REPLACE_ME…  the committed appsettings.json placeholders
#   CHANGEME     the k8s-secrets convention for committed Secret templates
#   password, your_password   README and docker-compose examples
# and template references that the defaults' own global allowlist does not
# already drop (it covers ${VAR}, $VAR, {0}, %s, {{x}}, xxx and ***): $(VAR),
# {name}, a spaced Helm/Go template (captured as exactly "{{", since the
# value stops at a space) and <name>. {name} is a trade-off: a real password
# written as {Word} is dropped too. A console scan with any finding is
# 'failed', so these would be CRITICAL noise on clean repos.
# __NAME__ is a render-at-startup marker (gitops' openmu ConfigMaps write
# Password=__DB_PW__ and an initContainer fills it from the Secret).
# NOT allowlisted, deliberately: postgres, secret, admin and the like. In a
# committed connection string those are usually the real (weak) credential,
# which is worth a finding.
#
# Local hosts (SCAN-109). A password whose Host/Server/Data Source is
# loopback (localhost, 127.0.0.1, ::1) or one of the two compose/CI
# service-container names the red repos use (db, postgres) guards nothing
# reachable from outside, so it is not a secret: dev appsettings,
# test fixtures and CI service containers wrote throwaway ones and went
# red. The regex's optional leading group pulls the host key into the MATCH
# (never the secret), and the second allowlist drops the finding when that
# host is local. Fails closed:
#   - any dot in the host (db.internal, *.svc.cluster.local, an IP other than
#     127.0.0.1) still fails, and so does a multi-host list (localhost,prod.x);
#   - the host key must come BEFORE the password inside the same quoted run,
#     else the match has no host in it and the finding stands;
#   - every key between the host and the password must be a listed benign
#     one (Port, Database, User Id…). The match runs from the FIRST host key,
#     so without this `Server=localhost;Failover Partner=prod.example.com`
#     (or a second Host=) ahead of the password would hide it; RE2 has no
#     lookahead to exclude host keys, so the allowlist names what may sit
#     there instead, and any other key keeps the finding.
# Not ANY dot-free name: an unqualified k8s Service (postgres-cluster-
# production-rw, dragonfly) reaches the real in-cluster database, so it still
# fails. The listed names are what compose files and CI `services:` use; a
# k8s Service literally named one of them would be missed. Add a name here
# only for a CI/compose container, never for a cluster Service: the list
# is just what the red repos needed, because homelab-platform alone runs
# Services named redis, mariadb and mongodb.
[[rules]]
id = "connection-string-password"
description = "Password in a connection string"
regex = '''(?i)(?:\b(?:host|server|data source|addr(?:ess)?|network address)=[^"'`\n]*?)?;[ \t]*(?:password|pwd)=["']?([^;"'`\s\\]+)'''
secretGroup = 1
keywords = ["password", "pwd"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = [
    '''(?i)^(?:replace[a-z0-9_]*|changeme|password|your_?password)$''',
    '''^(?:\$\([^)]*\)|\{[A-Za-z_][A-Za-z0-9_.]*\}|\{\{|<[^>]*>|__[A-Z][A-Z0-9_]*__)$''',
]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
    '''(?i)^(?:host|server|data source|addr(?:ess)?|network address)=(?:tcp:)?(?:localhost|127\.0\.0\.1|::1|db|postgres)(?:[,:][0-9]+)?;(?:[ \t]*(?:port|database|initial catalog|user ?id|user ?name|uid|user|integrated security|ssl ?mode|trust ?server ?certificate|encrypt|pooling|timeout|command timeout|include error detail)=[^;]*;)*[ \t]*(?:password|pwd)=''',
]

# scheme://user:password@host for the database and broker schemes. Not
# https://, which the default rules already cover per vendor. The user may be
# empty, which is Redis's own form (a bare ":" then the password).
# Same allowlist, less "{{" (a URI password ends at "@", never at a space),
# plus `pass` for `postgresql://user:pass@host/db` in scan.py's own docs.
# Local hosts here are LOOPBACK ONLY: the match runs on to the next space or
# quote, and the host must be the whole authority, so `@localhost:5432/db`
# is dropped but `@localhost,prod.example.com` and `@db.internal` are not.
# A query string may carry only listed parameters (sslmode…): libpq's
# `?host=prod.example.com` overrides the authority, so any other one keeps
# the finding. The allowlist is anchored from the scheme to the FIRST `@`
# (a password cannot hold one), so `@localhost` later in the path or query
# cannot vouch for a remote host. No service names at all, unlike the rule
# above: a URI is how k8s manifests here reach the real in-cluster databases,
# and no red repo needed it (chem-check's CI used localhost).
[[rules]]
id = "connection-uri-password"
description = "Password in a database connection URI"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|sqlserver|mssql)://[^:/@\s"'`]*:([^@/\s"'`\\]+)@[^\s"'`\\]*'''
secretGroup = 1
keywords = ["://"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = [
    '''(?i)^(?:replace[a-z0-9_]*|changeme|pass|password|your_?password)$''',
    '''^(?:\$\([^)]*\)|\{[A-Za-z_][A-Za-z0-9_.]*\}|<[^>]*>|__[A-Z][A-Z0-9_]*__)$''',
]

[[rules.allowlists]]
regexTarget = "match"
regexes = [
    '''(?i)^[a-z+]+://[^:/@\s"'`]*:[^@/\s"'`\\]+@(?:localhost|127\.0\.0\.1|\[::1\])(?::[0-9]+)?(?:/[^?#]*)?(?:\?(?:(?:sslmode|connect_timeout|application_name|schema|search_path)=[^&#=]*&?)*)?$''',
]
