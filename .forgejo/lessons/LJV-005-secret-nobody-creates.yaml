# MANAGED FILE — do not edit in this repository.
# Source of truth: lukejv-dev/homelab-platform → ops/forgejo-ci/files/lessons/
#
# LJV-005 — a CronJob/Job reads a Secret that no manifest in the tree creates
# (SCAN-209, from gitops listmonk/sdc-backup, 2026-10-21: merged before its
# Secret existed, CreateContainerConfigError then DeadlineExceeded, KubeJobFailed
# paged overnight).
#
# This file is the per-file half: every secretKeyRef / secretRef / secret volume
# in a CronJob or Job that is not `suspend: true`, with `optional: true` on the
# ref already cleared. opengrep sees one file at a time, so the cross-file half
# (drop the Secrets that ANY manifest in the tree creates) is in scan.py:
# created_secrets() builds the map, scan_sast() applies it for this rule id. Fixture:
# LJV-005-secret-nobody-creates.fixture (rule half); test_sast_rules.py (both).
#
# Diff-aware half (`in_diff: true`, so --diff runs it although lessons are
# whole-tree only): when the only makers of the Secret are Infisical/External
# syncs that this change added, the Secret is declared but its VALUES may not
# exist yet (the listmonk sdc-backup incident). scan_sast() keeps the finding,
# with a different message (new_in_diff() decides), unless the CronJob is `suspend: true`.
rules:
- id: LJV-005
  languages: [yaml]
  severity: WARNING
  message: >-
    CronJob reads Secret `$NAME`, which no manifest in this repo creates, and is not suspended.

    The first schedule fails with CreateContainerConfigError (or the job runs
    without its credentials) and pages, for a cause we already knew: a human
    step has not happened yet. Fix: ship the CronJob with `spec.suspend: true`
    and unsuspend it once the Secret exists (the merge row carries that
    pre-merge step), or create the Secret in the same PR (Secret manifest,
    InfisicalStaticSecret target). A Secret made by something outside the repo:
    add `optional: true` to the ref, or `# nosemgrep: LJV-005` with the reason.
    Docs: https://docs.lukejv.com/architecture/anti-patterns/#ljv-005-cronjob-reads-a-secret-nothing-creates
  metadata:
    lesson: LJV-005
    in_diff: true   # scan.py also runs this one in --diff (see diff-aware half)
    docs: https://docs.lukejv.com/architecture/anti-patterns/#ljv-005-cronjob-reads-a-secret-nothing-creates
  patterns:
  - pattern-either:
    - pattern-inside: |
        kind: CronJob
        ...
    - pattern-inside: |
        kind: Job
        ...
  - pattern-not-inside: |
      kind: $K
      ...
      spec:
        ...
        suspend: true
        ...
  - pattern-either:
    - pattern: |
        secretKeyRef:
          name: $NAME
          ...
    - pattern: |
        secretRef:
          name: $NAME
          ...
    - pattern: |
        secretName: $NAME
  - pattern-not: |
      secretKeyRef:
        optional: true
        ...
  - pattern-not: |
      secretRef:
        optional: true
        ...
