# MANAGED FILE — do not edit in this repository.
# Source of truth: lukejv-dev/homelab-platform → ops/forgejo-ci/files/lessons/
#
# LJV-001 — non-secret data in a k8s Secret (SCAN-153, from HLP-429/HLP-435).
# Flags each key of a git-tracked core `kind: Secret` whose NAME has no
# credential shape. Key names only: `data` values are base64 and a value test
# would need the plaintext anyway. Fixture: LJV-001-non-secret-in-secret.fixture.
#
# Not flagged on purpose:
#   - InfisicalStaticSecret targets: their `kind: Secret` has no `apiVersion: v1`
#     sibling, so the first pattern-inside cannot match them.
#   - ArgoCD repository/cluster Secrets (`argocd.argoproj.io/secret-type`):
#     Argo only reads those keys (`type`, `name`, `project`) from a Secret.
rules:
- id: LJV-001
  languages: [yaml]
  severity: WARNING
  message: >-
    Non-secret data in a k8s Secret: key `$KEY` has no credential shape.

    A Secret holding config hides it from review, diffs and `kubectl describe`,
    and wrapping config in a Secret to quiet a scanner just moves the problem.
    Fix: put non-secret keys in a ConfigMap; real credentials come from
    Infisical (InfisicalStaticSecret), never git. If the consumer can only read
    a Secret, keep it and add `# nosemgrep: LJV-001` with the reason.
    Docs: https://docs.lukejv.com/architecture/anti-patterns/#ljv-001-non-secret-config-stored-as-a-secret
  metadata:
    lesson: LJV-001
    docs: https://docs.lukejv.com/architecture/anti-patterns/#ljv-001-non-secret-config-stored-as-a-secret
  patterns:
  - pattern-inside: |
      apiVersion: v1
      kind: Secret
      ...
  - pattern-not-inside: |
      apiVersion: v1
      kind: Secret
      metadata:
        ...
        labels:
          ...
          argocd.argoproj.io/secret-type: $T
      ...
  - pattern-either:
    - pattern-inside: |
        stringData:
          ...
    - pattern-inside: |
        data:
          ...
  - pattern: |
      $KEY: $VAL
  # ponytail: key-name heuristic. Misses config under a credential-ish name
  # (`auth.yaml`) and flags an oddly named credential. Tuned on HLP-435's
  # 136-Secret audit: `identity` is the infisical-operator's identityId.
  - metavariable-regex:
      metavariable: $KEY
      regex: (?i)^(?!(stringdata|data)$)(?!.*(pass|pwd?([_.-]|$)|token|secret|key|cert|cred|auth|private|username|(^|[_.-])user(_?id)?$|dsn|url|uri|crt|pem|jwt|salt|hash|dockerconfig|seed|signing|session|cookie|webhook|identity_?id))
