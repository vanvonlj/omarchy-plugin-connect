# MANAGED FILE — do not edit in this repository.
# Source of truth: lukejv-dev/homelab-platform → ops/forgejo-ci/files/lessons/
#
# LJV-003 — a Secret in the same file as a Deployment/Service/etc. (SCAN-153,
# homelab-platform CLAUDE.md "Secret manifests" rule 3, swept 2026-09-06).
# Top-level `kind:` only (column 0), so an InfisicalStaticSecret target's
# indented `kind: Secret` does not count.
rules:
- id: LJV-003
  languages: [yaml]
  severity: WARNING
  message: >-
    A Secret shares a file with another kind.

    That file can be neither safely applied (it resets the live credential to
    the committed placeholder) nor safely renamed to .yaml.example (the other
    objects stop applying). Fix: split the Secret into its own
    `<name>.yaml.example` with CHANGEME values, or replace it with an
    InfisicalStaticSecret.
    Docs: https://docs.lukejv.com/architecture/anti-patterns/#ljv-003-a-secret-sharing-a-file-with-another-kind
  metadata:
    lesson: LJV-003
    docs: https://docs.lukejv.com/architecture/anti-patterns/#ljv-003-a-secret-sharing-a-file-with-another-kind
  # Reported on the Secret's own `kind:` line, whichever side the other is on.
  patterns:
  - pattern-either:
    # Secret may be quoted and carry a trailing comment.
    - pattern-regex: (?ms)^(?P<SECRET>kind:[ \t]*["']?Secret["']?[ \t]*(?:#[^\n]*)?$).*?^kind:[ \t]*(?!["']?Secret["']?[ \t]*(?:#[^\n]*)?$)\S+
    - pattern-regex: (?ms)^kind:[ \t]*(?!["']?Secret["']?[ \t]*(?:#[^\n]*)?$)\S+.*?^(?P<SECRET>kind:[ \t]*["']?Secret["']?[ \t]*(?:#[^\n]*)?$)
  - focus-metavariable: $SECRET
