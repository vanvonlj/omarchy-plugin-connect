# MANAGED FILE — do not edit in this repository.
# Source of truth: lukejv-dev/homelab-platform → ops/forgejo-ci/files/lessons/
#
# LJV-008 — a workflow step that starts an interpreter from the PR checkout in
# a job that holds secrets (CNVYR-466, from gitops#351 red-team pass 1,
# 2026-10-21: `python3 -c 'import yaml'` ran in the PR checkout, so a PR-added
# `yaml.py` was imported, and could replace the script that later ran with the
# ArgoCD and write tokens). Python puts the cwd (or the script's directory) on
# sys.path first; npm/npx read the checkout's `.npmrc` and run its scripts.
# "Holds secrets" is the whole job, not the step: an earlier step's code can
# plant what a later step runs, and the steps share one workspace and /tmp.
#
# Structural (YAML) rule: a `run:` whose text has an interpreter in command
# position (line start, after ; & | ( ` { $( or if/then/do/else/while, behind
# sudo/env/VAR=x) -- python/python3/python3.N, node, npm, npx, pip/pip3 --
# in a job (`jobs.<id>`) whose text has `${{ …secrets.… }}` anywhere (job env,
# step env, `with:`), or in any job of a file whose workflow-level `env:` (a
# sibling of `jobs:`, either order) has one (CNVYR-474).
# Not flagged: python with an `-I` flag (isolated: no cwd, no env vars, no user
# site) or a script at a literal /tmp, /usr or /opt path (sys.path gets the
# script's directory, not the cwd); `node /tmp/…`; npm/npx with
# `--ignore-scripts` or `-g`/`--global` on the line (a global install ignores the
# checkout's `.npmrc`, checked with npm on 2026-10-23); `--version`/`--help`; a step whose
# `working-directory` is a literal /tmp, /usr, /opt path or `runner.temp`.
# Not covered: `secrets: inherit` (CNVYR-474). The calling job has no steps, so
# it holds no `run:` to flag; the interpreter runs in the called workflow. A
# callee in the scanned repo is read as its own file (a secret reaches its jobs
# only as `${{ secrets.X }}`, which the job test sees); one in another repo is
# invisible to a single-file rule. Flagging the `uses:` line would fire on every
# call whatever the callee does. Also not covered: an interpreter behind a quote or path
# (`sh -c "python3 …"`, `/usr/bin/python3`), `xargs`, make/just/a script that
# starts one, and composite actions; an `if:` that keeps the secret step off PR runs is not read,
# so a job with a gated secret step still flags its other steps (use
# `# nosemgrep: LJV-008` with the reason). `-I` on python only: node and pip
# have no equivalent, so they are flagged unless the script is outside the
# checkout (node) or never (pip).
rules:
- id: LJV-008
  languages: [yaml]
  severity: WARNING
  message: >-
    Workflow step runs an interpreter from the PR checkout in a job that holds secrets.

    `python3 -c …`, `python3 x.py`, `node`, `npm ci` and `npx` resolve modules,
    `.npmrc` and package scripts from the checkout (a local install; `-g` ignores the `.npmrc`), which is the PR's own
    content, so a PR-added `yaml.py` or `.npmrc` runs with the job's tokens or
    plants what a later step runs. Fix: `python3 -I` (and `-S` if the script
    needs no site packages) on a script taken from the base ref outside the
    checkout, `npm ci --ignore-scripts`, or move the step into a job with no
    secrets. A deliberate exception is `# nosemgrep: LJV-008` with the reason.
    Docs: https://docs.lukejv.com/architecture/anti-patterns/#ljv-008-an-interpreter-run-from-the-pr-checkout-in-a-job-that-holds-secrets
  metadata:
    lesson: LJV-008
    docs: https://docs.lukejv.com/architecture/anti-patterns/#ljv-008-an-interpreter-run-from-the-pr-checkout-in-a-job-that-holds-secrets
  patterns:
  - pattern-either:
    # The job: any `key: value` pair but `jobs:` itself (whose value holds every job).
    - patterns:
      - pattern-inside: |
          $JOB: $BODY
      - metavariable-regex:
          metavariable: $JOB
          regex: ^(?!jobs$)
      - metavariable-regex:
          metavariable: $BODY
          regex: (?s)(?=.*\bsteps:)(?=.*\$\{\{[^}]*\bsecrets[.\[]).*
    # The workflow-level `env:` (a sibling of `jobs:`): every job inherits it. The
    # pattern is order-sensitive, so one alternative per key order.
    - patterns:
      - pattern-inside: |
          env: $ENV
          ...
          jobs: $JOBS
      - metavariable-regex:
          metavariable: $ENV
          regex: (?s).*\$\{\{[^}]*\bsecrets[.\[]
    - patterns:
      - pattern-inside: |
          jobs: $JOBS
          ...
          env: $ENV
      - metavariable-regex:
          metavariable: $ENV
          regex: (?s).*\$\{\{[^}]*\bsecrets[.\[]
  - pattern: |
      run: $CMD
  # metavariable-regex matches from the start of the text, hence the leading .*?
  - metavariable-regex:
      metavariable: $CMD
      regex: |-
        (?xs)
        .*?
        (?: \A | [\n;&|(`{] | \$\( | \b(?:if|then|do|else|elif|while|until)\b )
        [ \t]*
        (?: (?:sudo|exec|command|time|nohup|env)[ \t]+(?:-[A-Za-z]+[ \t]+)* | [A-Za-z_][A-Za-z0-9_]*=\S*[ \t]+ )*
        (?:
            python3? (?:\.[0-9]+)? \b
            (?! (?:[ \t]+-[A-Za-z]+)* [ \t]+-[A-Za-z]*I )
            (?! [ \t]+(?:-[A-Za-z]+[ \t]+)* /(?:tmp|usr|opt)/ )
          | node \b (?! [ \t]+/(?:tmp|usr|opt)/ )
          | (?: npm | npx ) \b (?! [^\n]*(?:--ignore-scripts|[ \t](?:-g|--global|--location=global)\b) )
          | pip3? \b )
        (?! [ \t]+(?:--version|-V|--help)\b )
  - pattern-not-inside:
      patterns:
      - pattern: |
          - ...
            working-directory: $WD
            ...
      - metavariable-regex:
          metavariable: $WD
          regex: ^["']?(/tmp/|/usr/|/opt/|\$RUNNER_TEMP|\$\{\{\s*runner\.temp)
