# MANAGED FILE — do not edit in this repository.
# Source of truth: lukejv-dev/homelab-platform → ops/forgejo-ci/workflows/
# Edit it there and re-run `ops/forgejo-ci/rollout.py apply --yes`. A local edit here
# is reported as drift by `rollout.py check` and overwritten on the next apply.

name: Secret scan

# CI backstop for the local pre-commit hook.
#
# The hook scans ONLY ADDED LINES, so it catches a secret being introduced but
# never one already in the tree, and it is bypassable with `--no-verify`. This
# job scans the whole working tree, on a server nobody can pass a flag to.
#
# Secrets are cheap to look for and binary when found, so this runs on EVERY
# commit on EVERY branch — no branch filter below, deliberately.
#
# NO RAFTER. This used to install `@rafter-security/cli` and shell out to
# `rafter secrets`. betterleaks is a standalone binary and Rafter was only ever
# a wrapper around it, so the CLI is gone and with it a class of confusing
# behaviour: the "hidden by .rafter.yml" message that actually meant
# .rafterignore, and the "output is not an array" warning on every clean scan.
#
# Per-repo allowlisting now lives in `.betterleaks.toml` (gitleaks-compatible)
# at the repo root — an UNMANAGED path. Note that dropping Rafter means
# `.rafterignore` is no longer read by anything; migrate its contents or every
# previously accepted false positive comes back as a CRITICAL.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    # catthehacker rather than the smaller `docker` (node:22-bookworm) label:
    # scan.py needs python3, and this image is guaranteed to have it. The image
    # is pulled once and cached on the runner (force_pull is false).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # Pinned to a SHA, not the mutable v4 tag (which is a branch
        # tip on the mirror and can move under us). This SHA is
        # code.forgejo.org/actions/checkout, the instance's
        # DEFAULT_ACTIONS_URL — a github.com SHA does not exist there.
        with:
          # Path mode reads the working tree, not history, so shallow is fine.
          fetch-depth: 1

      - name: Install betterleaks
        # Pinned deliberately. The scan is only meaningful against a known rule
        # set: an unpinned upgrade changes what counts as a finding and can turn
        # every repo red with no commit having changed. Bump it in the source of
        # truth — ops/forgejo-ci/files/scan.py pins the same version — and roll
        # out once.
        env:
          BETTERLEAKS_VERSION: "1.1.2"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" betterleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/betterleaks" version

      - name: Scan
        # scan.py is the same file you run locally — `scan.py --only secrets` —
        # so a clean local run predicts this job. It carries the canary that
        # proves betterleaks actually detects a planted key before believing a
        # clean result, which matters because a stale or missing binary reports
        # clean and exits 0.
        run: python3 .forgejo/scan.py --only secrets --format markdown .
