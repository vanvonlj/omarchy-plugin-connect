# MANAGED FILE — do not edit in this repository.
# Source of truth: lukejv-dev/homelab-platform → ops/forgejo-ci/workflows/
# Edit it there and re-run `ops/forgejo-ci/rollout.py apply --yes`. A local edit here
# is reported as drift by `rollout.py check` and overwritten on the next apply.

name: Secret scan

# CI backstop for the global Rafter pre-commit hook (~/.rafter/git-hooks).
#
# The hook scans ONLY ADDED LINES, so it catches a secret being introduced but
# never one already in the tree, and it is bypassable with `--no-verify`. This
# job scans the whole working tree, on a server nobody can pass a flag to.
#
# `rafter secrets` is local and free, so this runs on EVERY commit on EVERY
# branch — no branch filter below, deliberately. The metered backend scan
# (`rafter run`) is parked in ../parked/ and must never be added here; Rafter's
# backend does not support self-hosted git anyway.
#
# Engine is betterleaks, matching the local pre-commit hook, so a repo's
# .rafterignore means the same thing in both places and a clean commit predicts
# a clean pipeline.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    # The `docker` label is node:22-bookworm running as root — npm and git are
    # already there, which is all this job needs, and it is a far smaller pull
    # than the catthehacker images behind the `ubuntu-*` labels.
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Path mode reads the working tree, not history, so shallow is fine.
          fetch-depth: 1

      - name: Install Rafter CLI
        # Pinned deliberately. The scan is only meaningful against a known
        # pattern set: an unpinned upgrade changes what counts as a finding and
        # can turn every repo red with no commit having changed. Bump it here,
        # in the source of truth, and roll out once.
        run: npm install -g @rafter-security/cli@0.10.0

      - name: Install betterleaks
        # ~12MB from GitHub releases, checksum-verified by the CLI. Version is
        # pinned for the same reason the CLI is.
        #
        # Worth the download: betterleaks and the patterns engine have genuinely
        # different coverage, and on 2026-09-02 betterleaks found three LIVE
        # credentials in homelab-platform that patterns missed entirely — a
        # Proxmox API token, a Postgres password and a Scanopy API key. A
        # patterns-only pipeline had been reporting that repo green.
        run: rafter agent update-betterleaks --version 1.1.2

      - name: Scan working tree
        # Path mode (`.`) on purpose, NOT --staged/--diff. Those shell out to
        # `git diff` with Node's default maxBuffer and die with `spawnSync git
        # ENOBUFS` on a large diff — a crash, not a clean result, so it would
        # report nothing while looking like it passed. Path mode never invokes
        # git diff, and it is what lets CI see pre-existing secrets.
        #
        # The engine assertion below is not paranoia. This CLI degrades silently
        # in at least two ways: `--engine auto` falls back to patterns whenever
        # the betterleaks binary is missing, and `--no-auto-update` does the same
        # for a binary it considers stale. Either would quietly turn this job
        # back into the weaker scan that already missed three real credentials,
        # while still printing a green check. So: confirm which engine actually
        # ran, and fail loudly if it is not the one we asked for.
        #
        # Expect `(N finding(s) hidden by .rafter.yml)` — that message is wrong,
        # it means .rafterignore, and it appears even though no .rafter.yml
        # exists. Also expect a "Betterleaks output is not an array — possible
        # version mismatch" warning on a CLEAN scan: betterleaks writes `null`
        # rather than `[]` when it finds nothing. Both are cosmetic CLI bugs in
        # v0.10.0, neither affects the result.
        run: |
          set -euo pipefail
          rc=0
          rafter secrets . --engine betterleaks > scan.log 2>&1 || rc=$?
          cat scan.log
          if ! grep -q '(betterleaks)' scan.log; then
            echo
            echo "FAILED: the scan did not run on the betterleaks engine."
            echo "It silently fell back to a weaker detector. Treat this as a"
            echo "failed scan, not a clean one."
            exit 1
          fi
          exit $rc
