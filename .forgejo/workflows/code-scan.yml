# MANAGED FILE — do not edit in this repository.
# Source of truth: lukejv-dev/homelab-platform → ops/forgejo-ci/workflows/
# Edit it there and re-run `ops/forgejo-ci/rollout.py apply --yes`. A local edit here
# is reported as drift by `rollout.py check` and overwritten on the next apply.

name: Code scan

# Self-hosted SAST + SCA + IaC misconfiguration. Everything runs inside the job
# container: your code never leaves the network, there is no account, no API key
# and nothing metered. The only outbound traffic is vulnerability metadata
# coming IN — the OSV/deps.dev API. SAST rules are no longer fetched at all:
# opengrep has no registry, so `.forgejo/sast-rules.yml` ships beside scan.py.
#
# THE SCANNING LOGIC IS NOT IN THIS FILE. It is `.forgejo/scan.py`, the same
# file you run on a laptop, synced here by `rollout.py`. That is deliberate: a
# local run has to predict the pipeline or people stop trusting whichever one is
# more annoying, and two copies of a gate drift within a month. This workflow
# only installs the tools and calls it.
#
#   scan.py                  what CI runs below — whole tree
#   scan.py --diff           what you run before committing: only what your
#                            change introduced, and it gates HARD on that,
#                            because in a diff there is no backlog to excuse
#
# WHY NOT ON EVERY PUSH, when secret-scan is. This job installs ~400MB of
# tooling per run, because the runner's cache server is disabled (see
# rke2/forgejo/17-runner-pool-configmap.yaml). Capacity is 10 concurrent jobs
# as of 2026-09-10 — it was 2 when this rationale was written, on the single
# runner since retired — so queue monopolisation is no longer the reason.
# Per-push is still no benefit though: a secret appears the moment it is
# committed, but a dependency CVE is not a property of your commit at all — it
# lands when somebody else publishes an advisory against code nobody touched.
#
# THE PERIODIC RUN IS NOT HERE, AND CANNOT BE. A `schedule:` trigger stops
# Forgejo registering this workflow AT ALL on any branch that is not the default
# branch — not just the cron, the whole file, `pull_request` included. Verified
# 2026-09-04: adding it produced no run and no error, removing it as the only
# change made the run appear. Forgejo evaluates `pull_request` from the HEAD
# branch, so every PR branch would carry that schedule and PR scanning would
# silently stop. The weekly run is driven from the cluster instead —
# rke2/forgejo/15-code-scan-cronjob.yaml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  code-scan:
    # Needs python3 for scan.py itself; opengrep is a static binary.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 'true' only for the weekly run: a dispatch of the default branch, which
      # is what rke2/forgejo/15-code-scan-cronjob.yaml fires, with the org
      # variable set. A PR never reports — its branch reported to the same
      # target would mark findings fixed that still exist on the default
      # branch. A missing default_branch makes this false, not true. No secret
      # here: the token goes only into the env of the one step gated on this.
      # Delete the org variable SCAN_CONSOLE_URL to turn reporting off.
      REPORT_TO_CONSOLE: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.SCAN_CONSOLE_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the secrets layer can walk a commit range, and --diff
          # needs the base commit to exist locally.
          fetch-depth: 0

      - name: Install scanners
        # All pinned, and the same versions scan.py records in VERSIONS. An
        # unpinned bump changes what counts as a finding and can turn every repo
        # red with no commit having changed.
        env:
          OSV_VERSION: "2.5.1"
          TRIVY_VERSION: "0.74.0"
          OPENGREP_VERSION: "1.30.0"
          BETTERLEAKS_VERSION: "1.1.2"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$HOME/.local/bin/osv-scanner"
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar xz -C "$HOME/.local/bin" trivy
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" betterleaks
          # opengrep ships a static manylinux binary, so the SAST layer no
          # longer needs a venv. semgrep was a pip install, and this image is
          # Ubuntu 24.04 whose python is PEP 668 "externally managed" — that
          # whole dance is gone with it.
          curl -sSL -o "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan
        # scan.py runs its own canaries first and fails if any tool reports
        # deliberately-bad code as clean — opengrep with no rules, osv-scanner
        # with no network, trivy with no checks bundle and betterleaks with a
        # stale binary all otherwise exit 0 and print nothing.
        #
        # The gate is narrow on a whole-tree run: secrets fail, a CRITICAL
        # dependency CVE fails, IaC and SAST report. Their first-run backlogs
        # run to hundreds and a permanently red check is worth as much as no
        # check. Tighten per repo with --fail-on once a backlog is triaged.
        if: env.REPORT_TO_CONSOLE != 'true'
        run: python3 .forgejo/scan.py --format markdown .

      - name: Scan and report to scan-console
        # The same command as "Scan" above — exactly one of the two runs. With
        # both values set, scan.py POSTs the whole-tree result after printing
        # its verdict, best-effort: the report and exit code do not change, and
        # a console that is down costs one warning line on stderr. This is how
        # a new advisory against untouched code becomes a new finding there.
        #
        # The target is pinned, not derived from the checkout's `origin`: that
        # remote is whatever URL the runner was given, and a different host
        # would file every repo under a second target from the one a laptop
        # `scan` reports to, so nothing would ever resolve or reopen.
        if: env.REPORT_TO_CONSOLE == 'true'
        env:
          SCAN_CONSOLE_URL: ${{ vars.SCAN_CONSOLE_URL }}
          SCAN_CONSOLE_TOKEN: ${{ secrets.SCAN_CONSOLE_TOKEN }}
          SCAN_CONSOLE_TARGET: git.lukejv.com/${{ github.repository }}
        run: python3 .forgejo/scan.py --format markdown .
