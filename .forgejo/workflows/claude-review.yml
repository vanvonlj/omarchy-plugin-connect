# MANAGED FILE — do not edit in this repository.
# Source of truth: lukejv-dev/homelab-platform → ops/forgejo-ci/workflows/
# Edit it there and re-run `ops/forgejo-ci/rollout.py apply --yes`. A local edit here
# is reported as drift by `rollout.py check` and overwritten on the next apply.
#
# PER-REPO CUSTOMISATION goes in `.forgejo/claude-review.md`, NOT in this file.
# That path is not managed by the rollout; if it exists its contents are
# appended to the prompt as repo-specific review guidance. This is what lets one
# byte-identical workflow serve every repo.

name: Claude PR review

# Reviews the diff of every pull request and posts INLINE review comments —
# anchored to file and line, so each one is a thread Forgejo can resolve — plus
# a summary. Findings already raised on an earlier push are not repeated.
#
# THE REVIEW LOGIC IS NOT IN THIS FILE. It is `.forgejo/review.py`, synced here
# by `rollout.py`, same arrangement as scan.py: logic in a workflow file cannot
# be run or read anywhere but CI, and this one has real behaviour in it (diff
# anchoring, deduplication, a fallback path).
#
# Built on the Claude Code CLI plus Forgejo's own API rather than
# anthropics/claude-code-action, on purpose: that action is not mirrored on
# code.forgejo.org (this instance's DEFAULT_ACTIONS_URL), and it drives GitHub
# through Octokit, which Forgejo's API only partly matches. Shelling out keeps
# the moving parts on the Forgejo side where they are known to work.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    # Resolves to catthehacker/ubuntu:act-24.04 on the forgejo-runner (node +
    # git + python3 + curl already present). Runner capacity is 2, so a long
    # review occupies half the queue — hence the cap: a review that has not
    # finished in 20 minutes has hung, and without this it would hold that slot
    # until the runner's own (much longer) default gives up.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Need both sides of the comparison, so no shallow clone.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Take review.py from the BASE ref
        id: script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # NOT from the checkout. The step below puts CLAUDE_CODE_OAUTH_TOKEN in
          # the environment of whatever this file says to do, and the checkout is
          # the PR's own content — a branch that edits `.forgejo/review.py` would
          # otherwise be handed the token. From the base it is the maintainer's
          # file, which is the intent. Same reasoning as the guidance file.
          git fetch --no-tags origin "$BASE_SHA" 2>/dev/null || true
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          if git show "$MERGE_BASE:.forgejo/review.py" > /tmp/review.py 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            # A branch that forked before this workflow was rolled out. Skipping
            # is right: the alternative is running the PR's copy with the token.
            echo "no .forgejo/review.py at $MERGE_BASE — rebase onto the default branch"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.script.outputs.found == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Review
        if: steps.script.outputs.found == 'true'
        env:
          # Subscription auth (Claude Code Max/Pro), not a metered API key.
          # Generate with `claude setup-token` on a machine already logged in.
          # Set once as an ORGANISATION secret on lukejv-dev so every repo
          # inherits it.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Injected by Forgejo Actions, scoped to this repository.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 /tmp/review.py
